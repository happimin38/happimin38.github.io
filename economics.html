<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>경제 상식 노트 · 용어 · 기사</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="매일 경제 용어 하나를 익히고 관련 기사를 찾아 읽는 개인용 학습 노트" />
  <link rel="icon" href="icons/icon-economics-192.png" type="image/png" />
  <link rel="manifest" href="manifest-economics.json" />
  <meta name="theme-color" content="#0c1c14" />
  <link rel="apple-touch-icon" href="icons/icon-economics-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="경제 상식 노트" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --board: #0c1c14;
      --board-2: #14301f;
      --paper: #faf3e4;
      --paper-2: #f2e8d2;
      --paper-3: #e9dbb8;
      --hairline: rgba(47, 111, 79, 0.28);
      --ink: #22301f;
      --ink-soft: #5a5945;
      --ink-faint: #8a8368;

      --gold: #b8863c;
      --gold-strong: #d9a857;

      --cat-macro: #2f6f4f;
      --cat-market: #b8863c;
      --cat-finance: #3a6ea5;
      --cat-trade: #8a3b2e;
      --cat-policy: #6b4f8a;

      --good: #2f6f4f;
      --warn: #8a3b2e;

      --font-display: "Gaegu", "Noto Sans KR", sans-serif;
      --font-body: "Noto Sans KR", system-ui, -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    a { color: var(--gold); text-decoration: none; }
    a:hover { color: var(--gold-strong); }

    body {
      font-family: var(--font-body);
      background: var(--board);
      background-image:
        radial-gradient(ellipse 1000px 600px at 50% 0%, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0) 60%),
        radial-gradient(ellipse 1400px 900px at 50% 10%, #1a3d2e 0%, #0c1c14 55%, #071108 100%);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
    }

    .desk { padding: 36px 18px 64px; }

    /* Install bar */
    .install {
      max-width: 900px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px dashed rgba(217, 168, 87, 0.45);
      background: rgba(12, 28, 20, 0.55);
      font-size: 12px;
      color: #cbd8cd;
    }
    .install[hidden] { display: none; }
    .btn-install {
      padding: 7px 15px;
      border-radius: 999px;
      border: 1px solid var(--gold);
      background: rgba(217, 168, 87, 0.14);
      color: var(--gold-strong);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-install:hover { background: rgba(217, 168, 87, 0.24); }

    .sheet {
      max-width: 900px;
      margin: 0 auto;
      background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
      border-radius: 10px;
      padding: 32px 28px 40px;
      box-shadow:
        0 40px 80px -30px rgba(4, 10, 6, 0.75),
        0 2px 0 rgba(255, 255, 255, 0.5) inset,
        0 0 0 1px rgba(47, 111, 79, 0.12);
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 22px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--hairline);
      flex-wrap: wrap;
    }

    .seal {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--cat-macro), #1c4a34);
      font-size: 22px;
      box-shadow: 0 0 0 4px var(--paper), 0 0 0 5px var(--hairline);
    }

    .titles h1 {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .titles p { margin-top: 2px; font-size: 13px; color: var(--ink-soft); }

    .top-nav { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

    .top-nav a {
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.45);
    }
    .top-nav a:hover { border-color: var(--gold); color: var(--warn); }

    .section-title {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Today panel */
    .today-panel {
      border-radius: 14px;
      border: 1px solid rgba(217, 168, 87, 0.5);
      background: linear-gradient(160deg, rgba(217, 168, 87, 0.14), rgba(217, 168, 87, 0.04));
      padding: 18px 20px;
      margin-bottom: 22px;
    }

    .today-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .today-label {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .streak-chip {
      font-size: 12px;
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .today-term {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .today-cat {
      display: inline-block;
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 999px;
      color: #fff;
      margin-bottom: 10px;
    }

    .today-def { font-size: 14px; color: var(--ink); margin-bottom: 6px; }
    .today-tip { font-size: 13px; color: var(--ink-soft); font-style: italic; margin-bottom: 14px; }

    .today-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .btn {
      font-family: inherit;
      font-size: 12.5px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: rgba(255, 255, 255, 0.55);
      color: var(--ink);
      cursor: pointer;
    }
    .btn:hover { border-color: var(--gold); }
    .btn.primary {
      border-color: var(--good);
      background: rgba(47, 111, 79, 0.14);
      color: var(--good);
      font-weight: 600;
    }
    .btn.primary.done {
      background: var(--good);
      color: #fff;
    }
    .btn.link-btn { border-style: dashed; }

    .day-dots { display: flex; gap: 4px; margin-top: 10px; }
    .day-dot {
      width: 9px;
      height: 9px;
      border-radius: 3px;
      background: rgba(47, 111, 79, 0.18);
    }
    .day-dot.filled { background: var(--good); }

    /* Progress */
    .progress-wrap { margin-bottom: 22px; }
    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }
    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: rgba(47, 111, 79, 0.14);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cat-macro), var(--gold-strong));
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    /* Mode tabs */
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .mode-tab {
      flex: 1;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--hairline);
      background: rgba(255, 255, 255, 0.4);
      color: var(--ink-soft);
      cursor: pointer;
      text-align: center;
    }
    .mode-tab.active {
      background: var(--board-2);
      color: var(--paper);
      border-color: var(--board-2);
    }

    /* Controls */
    .controls { margin-bottom: 16px; }
    .search-input {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--hairline);
      background: rgba(255, 255, 255, 0.55);
      color: var(--ink);
      margin-bottom: 10px;
    }
    .search-input:focus { outline: 2px solid var(--gold-strong); outline-offset: 1px; }

    .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .chip {
      font-family: inherit;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: rgba(255, 255, 255, 0.4);
      color: var(--ink-soft);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chip .dot { width: 7px; height: 7px; border-radius: 999px; }
    .chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    .filter-toggle {
      font-size: 12px;
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .empty-note { font-size: 13px; color: var(--ink-faint); padding: 20px 4px; text-align: center; }

    /* Term list */
    .term-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }

    .term-card {
      border-radius: 10px;
      border: 1px solid var(--hairline);
      background: rgba(255, 255, 255, 0.45);
      overflow: hidden;
    }
    .term-card[open] { background: rgba(255, 255, 255, 0.75); }

    .term-card summary {
      list-style: none;
      cursor: pointer;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .term-card summary::-webkit-details-marker { display: none; }

    .term-dot { width: 9px; height: 9px; border-radius: 999px; flex-shrink: 0; }
    .term-name { font-weight: 700; font-size: 14.5px; flex: 1; }
    .term-badge {
      font-size: 10.5px;
      color: var(--good);
      border: 1px solid var(--good);
      border-radius: 999px;
      padding: 1px 8px;
      flex-shrink: 0;
    }
    .term-chevron { color: var(--ink-faint); font-size: 12px; transition: transform 0.15s ease; }
    .term-card[open] .term-chevron { transform: rotate(90deg); }

    .term-body { padding: 0 14px 16px 33px; }
    .term-def { font-size: 13.5px; color: var(--ink); margin-bottom: 8px; }
    .term-tip {
      font-size: 12.5px;
      color: var(--ink-soft);
      font-style: italic;
      background: rgba(184, 134, 60, 0.08);
      border-left: 2px solid var(--gold);
      padding: 6px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .term-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .term-actions .btn { font-size: 11.5px; padding: 6px 11px; }

    /* Flashcard mode */
    .quiz-setup { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    .quiz-select {
      font-family: inherit;
      font-size: 12.5px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--hairline);
      background: rgba(255, 255, 255, 0.55);
      color: var(--ink);
    }

    .quiz-progress { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; text-align: center; }

    .flashcard {
      min-height: 220px;
      border-radius: 14px;
      border: 1px solid var(--hairline);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.3));
      padding: 26px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .flashcard .fc-cat {
      display: inline-block;
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 999px;
      color: #fff;
      margin-bottom: 14px;
    }
    .flashcard .fc-term {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .flashcard .fc-hint { font-size: 12px; color: var(--ink-faint); }
    .flashcard .fc-def { font-size: 15px; color: var(--ink); margin-bottom: 10px; }
    .flashcard .fc-tip { font-size: 13px; color: var(--ink-soft); font-style: italic; }

    .quiz-controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
    .quiz-know-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .btn.know { border-color: var(--good); color: var(--good); }
    .btn.dontknow { border-color: var(--warn); color: var(--warn); }

    footer {
      max-width: 900px;
      margin: 22px auto 0;
      font-size: 11px;
      color: #7f8f83;
      text-align: center;
      line-height: 1.8;
    }
    footer a { color: var(--gold-strong); text-decoration: underline; text-underline-offset: 3px; }

    @media (max-width: 640px) {
      .sheet { padding: 24px 16px 32px; }
      .today-term { font-size: 20px; }
      .flashcard .fc-term { font-size: 22px; }
      .top-nav { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="desk">
    <div class="install" id="installBar" hidden>
      <span id="installText">홈 화면에 추가하면 앱처럼 바로 열 수 있어요.</span>
      <button class="btn-install" id="installBtn" type="button">홈 화면에 추가</button>
    </div>

    <div class="sheet">
      <header>
        <div class="seal">📘</div>
        <div class="titles">
          <h1>경제 상식 노트</h1>
          <p>매일 용어 하나, 기사 한 편</p>
        </div>
        <nav class="top-nav">
          <a href="english.html">영어 공부</a>
          <a href="index.html">← 홈</a>
        </nav>
      </header>

      <section class="today-panel">
        <div class="today-head">
          <span class="today-label">오늘의 용어</span>
          <span class="streak-chip" id="streakChip">🔥 0일 연속 학습</span>
        </div>
        <div class="today-term" id="todayTerm">-</div>
        <span class="today-cat" id="todayCat"></span>
        <div class="today-def" id="todayDef"></div>
        <div class="today-tip" id="todayTip"></div>
        <div class="today-actions">
          <button class="btn primary" id="todayStudyBtn" type="button">오늘 학습 완료로 표시</button>
          <a class="btn link-btn" id="todayLink1" target="_blank" rel="noopener">📰 관련 기사 (네이버)</a>
          <a class="btn link-btn" id="todayLink2" target="_blank" rel="noopener">📰 관련 기사 (구글)</a>
        </div>
        <div class="day-dots" id="dayDots" aria-hidden="true"></div>
      </section>

      <div class="progress-wrap">
        <div class="progress-row">
          <span>전체 학습 진행률</span>
          <span id="progressLabel">0 / 0</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>

      <div class="mode-tabs">
        <button class="mode-tab active" id="tabDict" type="button">📖 용어 사전</button>
        <button class="mode-tab" id="tabQuiz" type="button">🗂️ 플래시카드 복습</button>
      </div>

      <!-- Dictionary mode -->
      <div id="dictView">
        <div class="controls">
          <input class="search-input" id="searchInput" type="text" placeholder="용어나 설명으로 검색해보세요 (예: 금리, 환율)" />
          <div class="chip-row" id="categoryChips"></div>
          <label class="filter-toggle">
            <input type="checkbox" id="unstudiedOnly" />
            아직 학습 전 용어만 보기
          </label>
        </div>
        <div class="section-title">용어 목록 <span id="listCount"></span></div>
        <div class="term-list" id="termList"></div>
        <div class="empty-note" id="emptyNote" hidden>조건에 맞는 용어가 없어요. 검색어나 필터를 바꿔보세요.</div>
      </div>

      <!-- Flashcard quiz mode -->
      <div id="quizView" hidden>
        <div class="quiz-setup">
          <select class="quiz-select" id="quizSource">
            <option value="all">전체 용어</option>
            <option value="review">복습 목록만 (다시 볼래요 표시한 것)</option>
            <option value="macro">거시경제만</option>
            <option value="market">시장과 가격만</option>
            <option value="finance">금융과 투자만</option>
            <option value="trade">무역과 환율만</option>
            <option value="policy">정책과 제도만</option>
          </select>
          <button class="btn" id="shuffleBtn" type="button">🔀 순서 섞기</button>
        </div>
        <div class="quiz-progress" id="quizProgress"></div>
        <div class="flashcard" id="flashcard">
          <span class="fc-cat" id="fcCat"></span>
          <div class="fc-term" id="fcTerm">-</div>
          <div id="fcFront">
            <div class="fc-hint">탭하면 뜻이 보여요</div>
          </div>
          <div id="fcBack" hidden>
            <div class="fc-def" id="fcDef"></div>
            <div class="fc-tip" id="fcTip"></div>
          </div>
        </div>
        <div class="quiz-know-row">
          <button class="btn dontknow" id="dontKnowBtn" type="button">😅 다시 볼래요</button>
          <button class="btn know" id="knowBtn" type="button">✅ 이제 알아요</button>
        </div>
        <div class="quiz-controls">
          <button class="btn" id="prevBtn" type="button">← 이전</button>
          <button class="btn" id="nextBtn" type="button">다음 →</button>
        </div>
        <div class="empty-note" id="quizEmptyNote" hidden>이 목록에는 아직 용어가 없어요. 다른 목록을 골라보세요.</div>
      </div>
    </div>

    <footer>
      기록은 이 브라우저에만 저장됩니다. 기사 링크는 검색 결과 페이지로 새 창에 열려요.<br />
      더 공부하고 싶다면 <a href="english.html">영어 습관 트래커</a>도 함께 써보세요.
    </footer>
  </div>

  <script>
    /* ---------- Term data ---------- */
    const CATEGORIES = [
      { value: "macro", label: "거시경제", color: "var(--cat-macro)" },
      { value: "market", label: "시장과 가격", color: "var(--cat-market)" },
      { value: "finance", label: "금융과 투자", color: "var(--cat-finance)" },
      { value: "trade", label: "무역과 환율", color: "var(--cat-trade)" },
      { value: "policy", label: "정책과 제도", color: "var(--cat-policy)" },
    ];
    const CAT_MAP = Object.fromEntries(CATEGORIES.map((c) => [c.value, c]));

    const TERMS = [
      { id: "gdp", term: "GDP (국내총생산)", cat: "macro", q: "GDP 국내총생산", def: "한 나라 안에서 일정 기간 동안 새로 생산된 모든 재화와 서비스의 가치를 합한 것. 한 나라 경제의 크기를 보여주는 대표 지표예요.", tip: "나라 전체가 한 해 동안 벌어들인 소득의 총합이라고 생각하면 쉬워요." },
      { id: "inflation", term: "인플레이션", cat: "macro", def: "물가가 전반적으로, 지속적으로 오르는 현상. 같은 돈으로 살 수 있는 물건의 양이 점점 줄어들어요.", tip: "작년엔 5천원이던 김밥이 올해 6천원이 됐다면, 그게 바로 인플레이션이에요." },
      { id: "deflation", term: "디플레이션", cat: "macro", def: "물가가 전반적으로 지속해서 떨어지는 현상. 소비와 투자가 늦춰지면서 경기가 함께 위축되기 쉬워요.", tip: "물건값이 계속 내려가면 사람들이 '더 싸질 때까지 기다리자'며 지갑을 닫는 게 문제예요." },
      { id: "stagflation", term: "스태그플레이션", cat: "macro", def: "경기는 침체되는데 물가는 오히려 오르는, 함께 나타나기 어려운 두 현상이 동시에 벌어지는 상태예요.", tip: "월급은 안 오르는데 장바구니 물가만 오르는, 다들 힘들어지는 상황이에요." },
      { id: "base_rate", term: "기준금리", cat: "policy", def: "한국은행 같은 중앙은행이 결정하는 금리로, 시중 은행의 예금·대출 금리 등 다른 모든 금리의 기준이 돼요.", tip: "기준금리가 오르면 대출이자도, 예금이자도 함께 오르는 게 보통이에요." },
      { id: "monetary_policy", term: "통화정책", cat: "policy", def: "중앙은행이 기준금리나 통화량을 조절해서 물가와 경기를 관리하는 정책이에요.", tip: "돈의 수도꼭지를 잠그거나 트는 일이라고 보면 돼요." },
      { id: "fiscal_policy", term: "재정정책", cat: "policy", def: "정부가 세금을 걷고 예산을 지출하는 방식을 조절해서 경기를 관리하는 정책이에요.", tip: "정부가 돈을 더 쓰거나 덜 쓰면서 경기를 조절하는 거예요." },
      { id: "qe", term: "양적완화 (QE)", cat: "policy", q: "양적완화 QE", def: "중앙은행이 국채 등을 대규모로 사들여 시중에 돈을 직접 풀어주는 비전통적 통화정책이에요.", tip: "금리를 더 내릴 여지가 없을 때 중앙은행이 '돈을 직접 찍어 뿌리는' 것에 가까워요." },
      { id: "tapering", term: "테이퍼링", cat: "policy", def: "중앙은행이 양적완화로 풀던 돈의 양을 서서히 줄여나가는 것을 말해요.", tip: "수도꼭지를 갑자기 잠그지 않고 조금씩 잠가가는 거예요." },
      { id: "reserve_ratio", term: "지급준비율", cat: "policy", def: "은행이 고객 예금 중 일정 비율을 중앙은행에 의무적으로 맡겨야 하는 비율이에요.", tip: "이 비율을 올리면 은행이 대출해줄 수 있는 돈이 줄어들어요." },
      { id: "business_cycle", term: "경기순환", cat: "macro", def: "경제가 호황과 불황을 오가며 반복적으로 움직이는 흐름이에요. 보통 확장기-정점-수축기-저점 순으로 이어져요.", tip: "계절이 바뀌듯 경기도 좋았다 나빴다를 반복한다고 보면 돼요." },
      { id: "leading_index", term: "경기선행지수", cat: "macro", def: "실제 경기보다 몇 달 앞서 움직이는 지표들을 모아, 앞으로의 경기 흐름을 미리 가늠해보는 지수예요.", tip: "일기예보처럼 경기가 좋아질지 나빠질지 미리 알려주는 신호예요." },
      { id: "unemployment_rate", term: "실업률", cat: "macro", def: "일할 능력과 의사가 있는 경제활동인구 중에서 일자리를 구하지 못한 사람의 비율이에요.", tip: "구직 활동을 포기한 사람은 통계에 안 잡힐 수 있어 체감과 다를 때가 있어요." },
      { id: "employment_rate", term: "고용률", cat: "macro", def: "생산가능인구(보통 15세 이상) 중 실제로 취업한 사람의 비율이에요.", tip: "실업률과 짝을 이루는 지표지만, 구직 포기자까지 반영해 체감에 더 가까울 때가 많아요." },
      { id: "phillips_curve", term: "필립스 곡선", cat: "macro", def: "실업률이 낮아지면 물가상승률이 높아지고, 반대로 실업률이 높아지면 물가상승률이 낮아지는 관계를 보여주는 곡선이에요.", tip: "'일자리'와 '물가안정' 두 마리 토끼를 동시에 잡기 어렵다는 걸 보여줘요." },
      { id: "multiplier_effect", term: "승수효과", cat: "macro", def: "정부 지출이나 투자가 한 번 늘어나면, 그 돈이 여러 번 순환하며 처음보다 더 큰 경제 효과를 만들어내는 현상이에요.", tip: "내가 쓴 돈이 다른 사람의 소득이 되고, 그 사람이 또 돈을 쓰면서 눈덩이처럼 불어나는 거예요." },
      { id: "potential_growth", term: "잠재성장률", cat: "macro", def: "한 나라가 보유한 노동력과 자본, 기술을 물가 상승 부담 없이 최대한 활용했을 때 달성 가능한 성장률이에요.", tip: "무리하지 않고 낼 수 있는 '경제의 최대 순항 속도'라고 보면 돼요." },
      { id: "gni", term: "GNI (국민총소득)", cat: "macro", q: "GNI 국민총소득", def: "한 나라의 국민이 국내외에서 벌어들인 소득을 모두 합한 지표로, 국민의 실제 살림살이를 보여줘요.", tip: "GDP가 '국경 안 생산'이라면, GNI는 '국민이 번 돈' 기준이에요." },
      { id: "supply_demand", term: "수요와 공급", cat: "market", def: "사려는 사람(수요)과 팔려는 사람(공급)의 힘이 만나 가격과 거래량이 정해지는 시장의 기본 원리예요.", tip: "사려는 사람이 많아지면 값이 오르고, 팔려는 물건이 많아지면 값이 내려가요." },
      { id: "price_elasticity", term: "가격탄력성", cat: "market", def: "가격이 변할 때 수요량이나 공급량이 얼마나 민감하게 변하는지를 나타내는 지표예요.", tip: "생필품은 값이 올라도 사던 대로 사고, 사치품은 값이 오르면 확 덜 사는 것과 관련 있어요." },
      { id: "opportunity_cost", term: "기회비용", cat: "market", def: "하나를 선택하면서 포기하게 되는 다른 선택지 중 가장 가치 있는 것의 가치예요.", tip: "야근 대신 헬스장을 갔다면, 포기한 야근수당이 기회비용이에요." },
      { id: "sunk_cost", term: "매몰비용", cat: "market", def: "이미 써버려서 다시 되돌릴 수 없는 비용. 앞으로의 선택에는 영향을 주지 않는 게 합리적이에요.", tip: "재미없는 영화라도 표값이 아까워 끝까지 보는 건 매몰비용에 발목 잡힌 거예요." },
      { id: "marginal_utility", term: "한계효용", cat: "market", def: "재화나 서비스를 한 단위 더 소비할 때 추가로 얻는 만족감이에요. 보통 소비량이 늘수록 점점 줄어들어요.", tip: "첫 치킨 한 조각은 꿀맛이지만, 배부른 뒤 마지막 조각은 감흥이 덜한 것과 같아요." },
      { id: "economies_of_scale", term: "규모의 경제", cat: "market", def: "생산량이 늘어날수록 제품 하나를 만드는 평균 비용이 줄어드는 현상이에요.", tip: "많이 만들수록 개당 원가가 싸지는 거예요. 대량생산이 유리한 이유예요." },
      { id: "externality", term: "외부효과", cat: "market", def: "어떤 경제활동이 거래 당사자가 아닌 제3자에게 의도치 않은 이익이나 손해를 주는 경우예요.", tip: "공장 매연으로 이웃 주민이 피해를 보는 건 '부정적 외부효과'의 대표 사례예요." },
      { id: "public_good", term: "공공재", cat: "market", def: "누구나 대가 없이 이용할 수 있고, 한 사람이 써도 다른 사람이 쓸 수 있는 양이 줄지 않는 재화예요. 가로등, 국방 등이 해당돼요.", tip: "내가 가로등 불빛을 쓴다고 옆 사람 몫이 줄어들지는 않죠." },
      { id: "oligopoly_monopoly", term: "독과점", cat: "market", def: "한 기업(독점)이나 소수 기업(과점)이 시장을 지배해 가격이나 공급량에 큰 영향력을 행사하는 상태예요.", tip: "경쟁자가 거의 없다 보니 소비자 입장에서 가격 협상력이 약해져요." },
      { id: "perfect_competition", term: "완전경쟁시장", cat: "market", def: "다수의 판매자와 구매자가 동일한 상품을 거래하며, 누구도 가격에 영향을 줄 수 없는 이론적인 시장 형태예요.", tip: "현실에는 드물지만, 시장 원리를 이해하는 기준점 역할을 해요." },
      { id: "exchange_rate", term: "환율", cat: "trade", def: "우리나라 돈과 다른 나라 돈을 교환하는 비율이에요. 원/달러 환율이 오르면 원화 가치는 떨어진 거예요.", tip: "환율이 오르면 해외여행이나 수입품이 더 비싸지고, 수출기업엔 유리해질 수 있어요." },
      { id: "reserve_currency", term: "기축통화", cat: "trade", def: "국제 무역과 금융 거래에서 기준이 되는 통화. 현재는 미국 달러가 대표적인 기축통화예요.", tip: "전 세계가 '공용어'처럼 쓰는 돈이라고 보면 돼요." },
      { id: "trade_balance", term: "무역수지", cat: "trade", def: "일정 기간 동안 상품 수출액에서 수입액을 뺀 값이에요. 플러스면 흑자, 마이너스면 적자예요.", tip: "물건을 판 돈에서 사온 돈을 뺀 나라의 '가계부' 같은 거예요." },
      { id: "current_account", term: "경상수지", cat: "trade", def: "무역수지에 서비스, 배당·이자 같은 소득, 이전거래까지 더해 한 나라의 대외 거래 전체를 보여주는 지표예요.", tip: "무역수지보다 더 큰 범위로, 나라 살림의 '큰 가계부'라고 보면 돼요." },
      { id: "tariff", term: "관세", cat: "trade", def: "다른 나라에서 들여오는 상품에 부과하는 세금이에요. 국내 산업 보호나 정부 수입 확보 목적으로 쓰여요.", tip: "수입품에 관세가 붙으면 그만큼 국내 판매 가격도 올라가는 경우가 많아요." },
      { id: "fta", term: "FTA (자유무역협정)", cat: "trade", q: "FTA 자유무역협정", def: "국가 간에 관세나 무역 장벽을 낮추거나 없애기로 맺는 협정이에요.", tip: "서로 물건을 더 싸고 쉽게 사고팔 수 있게 문턱을 낮추는 약속이에요." },
      { id: "fx_hedge", term: "환헤지", cat: "trade", def: "환율 변동으로 인한 손실 위험을 줄이기 위해 미리 환율을 고정하거나 대비해두는 거래예요.", tip: "해외 투자를 할 때 환율이 요동쳐도 손해를 덜 보려고 드는 '환율 보험'이에요." },
      { id: "dollar_strength", term: "강달러 / 약달러", cat: "trade", q: "강달러 환율", def: "다른 통화 대비 달러 가치가 오르는 것을 강달러, 내리는 것을 약달러라고 해요. 원/달러 환율과 신흥국 경제에 큰 영향을 줘요.", tip: "강달러 시기엔 원화 가치가 상대적으로 약해져 수입 물가 부담이 커지곤 해요." },
      { id: "stock", term: "주식", cat: "finance", def: "회사의 소유권 일부를 나타내는 증서예요. 주식을 사면 그 회사의 주주가 돼요.", tip: "회사가 잘되면 주가나 배당으로 이익을 나눠 받을 수 있어요." },
      { id: "bond", term: "채권", cat: "finance", def: "정부나 기업이 돈을 빌리면서 발행하는 '차용증'이에요. 정해진 이자와 만기에 원금을 돌려주기로 약속해요.", tip: "주식과 달리 정해진 이자를 받는, 상대적으로 안정적인 투자 수단이에요." },
      { id: "dividend", term: "배당", cat: "finance", def: "기업이 벌어들인 이익의 일부를 주주에게 나눠주는 것이에요.", tip: "회사가 낸 이익을 주주들끼리 나눠 갖는 거예요." },
      { id: "per", term: "PER (주가수익비율)", cat: "finance", q: "PER 주가수익비율", def: "주가를 주당순이익(EPS)으로 나눈 값으로, 현재 주가가 회사 이익 대비 비싼지 싼지를 가늠하는 지표예요.", tip: "PER이 낮을수록 '이익 대비 저평가'됐다고 보는 경우가 많아요. 물론 업종마다 기준은 달라요." },
      { id: "pbr", term: "PBR (주가순자산비율)", cat: "finance", q: "PBR 주가순자산비율", def: "주가를 주당순자산으로 나눈 값으로, 회사가 가진 자산 대비 주가 수준을 보여줘요.", tip: "PBR 1 미만이면 회사를 통째로 청산했을 때보다 주가가 싸다는 뜻이 될 수 있어요." },
      { id: "etf", term: "ETF", cat: "finance", q: "ETF 상장지수펀드", def: "여러 주식이나 자산을 묶어 하나의 상품처럼 거래소에서 사고팔 수 있게 만든 펀드예요.", tip: "코스피200 ETF 하나만 사도 200개 회사에 나눠 투자한 효과를 낼 수 있어요." },
      { id: "diversification", term: "분산투자", cat: "finance", def: "한 자산에 돈을 몰아넣지 않고 여러 자산에 나눠 투자해서 위험을 줄이는 전략이에요.", tip: "계란을 한 바구니에 담지 말라는 말이 바로 분산투자예요." },
      { id: "compound_interest", term: "복리", cat: "finance", def: "원금뿐 아니라 이미 붙은 이자에도 다시 이자가 붙는 방식이에요. 기간이 길어질수록 효과가 커져요.", tip: "눈덩이를 굴릴수록 점점 더 빨리 커지는 것과 비슷해요." },
      { id: "liquidity", term: "유동성", cat: "finance", def: "자산을 얼마나 빠르고 쉽게 현금으로 바꿀 수 있는지를 나타내는 정도예요.", tip: "현금은 유동성이 가장 높고, 부동산은 상대적으로 유동성이 낮아요." },
      { id: "credit_rating", term: "신용등급", cat: "finance", def: "국가나 기업이 빌린 돈을 제때 갚을 능력이 얼마나 되는지 평가 기관이 매기는 점수예요.", tip: "등급이 높을수록 돈을 더 싸게(낮은 금리로) 빌릴 수 있어요." },
      { id: "volatility", term: "변동성", cat: "finance", def: "가격이 짧은 기간 동안 얼마나 크게 오르내리는지를 나타내는 정도예요.", tip: "변동성이 크다는 건 그만큼 수익도 손실도 커질 수 있다는 뜻이에요." },
      { id: "bond_rate_relation", term: "금리와 채권가격의 관계", cat: "finance", q: "금리 채권가격 관계", def: "시중 금리가 오르면 기존 채권의 매력이 떨어져 채권 가격은 내려가고, 금리가 내리면 반대로 채권 가격은 올라가요.", tip: "새로 나온 채권이 이자를 더 많이 주면, 이자가 낮은 헌 채권은 인기가 떨어지겠죠." },
      { id: "government_bond", term: "국채", cat: "finance", def: "정부가 재정을 마련하기 위해 발행하는 채권이에요. 나라가 보증하는 만큼 상대적으로 안전한 자산으로 꼽혀요.", tip: "나라가 발행하는 '나라 차용증'이라고 보면 돼요." },
      { id: "circuit_breaker", term: "서킷브레이커", cat: "finance", def: "주가지수가 일정 폭 이상 급락할 때 시장의 충격을 줄이기 위해 일시적으로 거래를 멈추는 제도예요.", tip: "패닉셀이 번지지 않도록 잠깐 '타임아웃'을 주는 안전장치예요." },
      { id: "recession", term: "경기침체 (리세션)", cat: "macro", q: "경기침체 리세션", def: "경제 활동이 광범위하게, 일정 기간 이상 위축되는 상태를 말해요. 통상 GDP가 두 분기 연속 감소하면 신호로 봐요.", tip: "회사 매출도, 채용도, 소비도 다 같이 움츠러드는 시기예요." },
      { id: "cpi", term: "CPI (소비자물가지수)", cat: "macro", q: "CPI 소비자물가지수", def: "가계가 자주 사는 상품과 서비스의 가격 변동을 종합해 지수로 나타낸 물가 지표예요.", tip: "장바구니 물가가 예전보다 얼마나 올랐는지 숫자로 보여주는 거예요." },
    ];

    const TERM_MAP = Object.fromEntries(TERMS.map((t) => [t.id, t]));

    /* ---------- State ---------- */
    const STORAGE_KEY = "econStudyApp_v1";

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return {
          studied: parsed.studied && typeof parsed.studied === "object" ? parsed.studied : {},
          review: parsed.review && typeof parsed.review === "object" ? parsed.review : {},
          days: parsed.days && typeof parsed.days === "object" ? parsed.days : {},
        };
      } catch (e) {
        return { studied: {}, review: {}, days: {} };
      }
    }

    const state = loadState();

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function markStudiedToday(id) {
      state.studied[id] = true;
      state.days[todayKey()] = true;
      saveState();
    }

    function toggleStudied(id) {
      if (state.studied[id]) {
        delete state.studied[id];
      } else {
        state.studied[id] = true;
        state.days[todayKey()] = true;
      }
      saveState();
    }

    function setReview(id, on) {
      if (on) state.review[id] = true;
      else delete state.review[id];
      saveState();
    }

    /* ---------- Helpers ---------- */
    function articleLinks(t) {
      const q = t.q || t.term.replace(/\(.+?\)/g, "").trim();
      const naver = `https://search.naver.com/search.naver?where=news&query=${encodeURIComponent(q + " 경제")}`;
      const google = `https://news.google.com/search?q=${encodeURIComponent(q + " 경제")}&hl=ko&gl=KR&ceid=KR%3Ako`;
      return { naver, google };
    }

    function dayOfYear(d) {
      const start = new Date(d.getFullYear(), 0, 0);
      const diff = d - start;
      return Math.floor(diff / 86400000);
    }

    function termOfDay() {
      const idx = dayOfYear(new Date()) % TERMS.length;
      return TERMS[idx];
    }

    function currentStreak() {
      let streak = 0;
      const d = new Date();
      while (true) {
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        if (state.days[key]) {
          streak++;
          d.setDate(d.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    function refreshStreak() {
      document.getElementById("streakChip").textContent = `🔥 ${currentStreak()}일 연속 학습`;
    }

    /* ---------- Today panel ---------- */
    const today = termOfDay();
    const todayLinks = articleLinks(today);

    document.getElementById("todayTerm").textContent = today.term;
    const todayCatEl = document.getElementById("todayCat");
    todayCatEl.textContent = CAT_MAP[today.cat].label;
    todayCatEl.style.background = CAT_MAP[today.cat].color;
    document.getElementById("todayDef").textContent = today.def;
    document.getElementById("todayTip").textContent = "💡 쉽게 말하면: " + today.tip;
    document.getElementById("todayLink1").href = todayLinks.naver;
    document.getElementById("todayLink2").href = todayLinks.google;

    const todayStudyBtn = document.getElementById("todayStudyBtn");
    function refreshTodayBtn() {
      const done = !!state.studied[today.id];
      todayStudyBtn.textContent = done ? "✓ 오늘 학습 완료" : "오늘 학습 완료로 표시";
      todayStudyBtn.classList.toggle("done", done);
    }
    todayStudyBtn.addEventListener("click", () => {
      toggleStudied(today.id);
      refreshTodayBtn();
      refreshProgress();
      renderTermList();
      refreshStreak();
      renderDayDots();
    });

    const dayDotsEl = document.getElementById("dayDots");
    function renderDayDots() {
      dayDotsEl.innerHTML = "";
      const d = new Date();
      d.setDate(d.getDate() - 13);
      for (let i = 0; i < 14; i++) {
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        const dot = document.createElement("span");
        dot.className = "day-dot" + (state.days[key] ? " filled" : "");
        dayDotsEl.appendChild(dot);
        d.setDate(d.getDate() + 1);
      }
    }
    renderDayDots();

    /* ---------- Progress ---------- */
    function refreshProgress() {
      const count = Object.keys(state.studied).filter((id) => TERM_MAP[id]).length;
      document.getElementById("progressLabel").textContent = `${count} / ${TERMS.length}`;
      document.getElementById("progressFill").style.width = `${(count / TERMS.length) * 100}%`;
    }

    /* ---------- Category chips ---------- */
    let activeCat = "all";
    const chipRow = document.getElementById("categoryChips");

    function buildChips() {
      chipRow.innerHTML = "";
      const allChip = document.createElement("button");
      allChip.className = "chip active";
      allChip.type = "button";
      allChip.textContent = "전체";
      allChip.dataset.cat = "all";
      chipRow.appendChild(allChip);

      CATEGORIES.forEach((c) => {
        const chip = document.createElement("button");
        chip.className = "chip";
        chip.type = "button";
        chip.dataset.cat = c.value;
        chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label}`;
        chipRow.appendChild(chip);
      });

      chipRow.addEventListener("click", (e) => {
        const btn = e.target.closest(".chip");
        if (!btn) return;
        activeCat = btn.dataset.cat;
        [...chipRow.children].forEach((c) => c.classList.toggle("active", c === btn));
        renderTermList();
      });
    }
    buildChips();

    /* ---------- Dictionary list ---------- */
    const termListEl = document.getElementById("termList");
    const searchInput = document.getElementById("searchInput");
    const unstudiedOnly = document.getElementById("unstudiedOnly");
    const emptyNote = document.getElementById("emptyNote");
    const listCount = document.getElementById("listCount");

    function renderTermList() {
      const query = searchInput.value.trim().toLowerCase();
      const onlyUnstudied = unstudiedOnly.checked;

      const filtered = TERMS.filter((t) => {
        if (activeCat !== "all" && t.cat !== activeCat) return false;
        if (onlyUnstudied && state.studied[t.id]) return false;
        if (query && !(t.term.toLowerCase().includes(query) || t.def.toLowerCase().includes(query))) return false;
        return true;
      });

      listCount.textContent = `(${filtered.length}개)`;
      termListEl.innerHTML = "";
      emptyNote.hidden = filtered.length > 0;

      filtered.forEach((t) => {
        const cat = CAT_MAP[t.cat];
        const links = articleLinks(t);
        const details = document.createElement("details");
        details.className = "term-card";

        const summary = document.createElement("summary");
        summary.innerHTML = `
          <span class="term-dot" style="background:${cat.color}"></span>
          <span class="term-name">${t.term}</span>
          ${state.studied[t.id] ? '<span class="term-badge">학습완료</span>' : ""}
          <span class="term-chevron">▸</span>
        `;
        details.appendChild(summary);

        const body = document.createElement("div");
        body.className = "term-body";
        body.innerHTML = `
          <div class="term-def">${t.def}</div>
          <div class="term-tip">💡 쉽게 말하면: ${t.tip}</div>
          <div class="term-actions">
            <button class="btn primary study-toggle" type="button">${state.studied[t.id] ? "✓ 학습완료" : "학습 완료로 표시"}</button>
            <a class="btn link-btn" href="${links.naver}" target="_blank" rel="noopener">📰 네이버 기사</a>
            <a class="btn link-btn" href="${links.google}" target="_blank" rel="noopener">📰 구글 뉴스</a>
          </div>
        `;
        details.appendChild(body);

        body.querySelector(".study-toggle").addEventListener("click", () => {
          toggleStudied(t.id);
          refreshProgress();
          if (t.id === today.id) refreshTodayBtn();
          refreshStreak();
          renderDayDots();
          renderTermList();
        });

        termListEl.appendChild(details);
      });
    }

    searchInput.addEventListener("input", renderTermList);
    unstudiedOnly.addEventListener("change", renderTermList);

    /* ---------- Mode tabs ---------- */
    const tabDict = document.getElementById("tabDict");
    const tabQuiz = document.getElementById("tabQuiz");
    const dictView = document.getElementById("dictView");
    const quizView = document.getElementById("quizView");

    tabDict.addEventListener("click", () => {
      tabDict.classList.add("active");
      tabQuiz.classList.remove("active");
      dictView.hidden = false;
      quizView.hidden = true;
    });
    tabQuiz.addEventListener("click", () => {
      tabQuiz.classList.add("active");
      tabDict.classList.remove("active");
      quizView.hidden = false;
      dictView.hidden = true;
      renderQuizCard();
    });

    /* ---------- Flashcard quiz ---------- */
    const quizSource = document.getElementById("quizSource");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const flashcard = document.getElementById("flashcard");
    const fcFront = document.getElementById("fcFront");
    const fcBack = document.getElementById("fcBack");
    const fcCat = document.getElementById("fcCat");
    const fcTerm = document.getElementById("fcTerm");
    const fcDef = document.getElementById("fcDef");
    const fcTip = document.getElementById("fcTip");
    const quizProgress = document.getElementById("quizProgress");
    const quizEmptyNote = document.getElementById("quizEmptyNote");
    const knowBtn = document.getElementById("knowBtn");
    const dontKnowBtn = document.getElementById("dontKnowBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let quizPool = [];
    let quizIndex = 0;
    let flipped = false;

    function buildQuizPool() {
      const src = quizSource.value;
      if (src === "all") quizPool = TERMS.map((t) => t.id);
      else if (src === "review") quizPool = TERMS.filter((t) => state.review[t.id]).map((t) => t.id);
      else quizPool = TERMS.filter((t) => t.cat === src).map((t) => t.id);
      quizIndex = 0;
      flipped = false;
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function renderQuizCard() {
      const hasCards = quizPool.length > 0;
      flashcard.hidden = !hasCards;
      knowBtn.hidden = !hasCards;
      dontKnowBtn.hidden = !hasCards;
      prevBtn.hidden = !hasCards;
      nextBtn.hidden = !hasCards;
      quizEmptyNote.hidden = hasCards;
      quizProgress.textContent = hasCards ? "" : "";
      if (!hasCards) {
        quizProgress.textContent = "";
        return;
      }

      const t = TERM_MAP[quizPool[quizIndex]];
      quizProgress.textContent = `${quizIndex + 1} / ${quizPool.length}`;
      fcFront.hidden = flipped;
      fcBack.hidden = !flipped;
      fcCat.textContent = CAT_MAP[t.cat].label;
      fcCat.style.background = CAT_MAP[t.cat].color;
      fcTerm.textContent = t.term;
      fcDef.textContent = t.def;
      fcTip.textContent = "💡 " + t.tip;
    }

    flashcard.addEventListener("click", () => {
      if (quizPool.length === 0) return;
      flipped = !flipped;
      renderQuizCard();
    });

    function goNext() {
      if (quizPool.length === 0) return;
      quizIndex = (quizIndex + 1) % quizPool.length;
      flipped = false;
      renderQuizCard();
    }
    function goPrev() {
      if (quizPool.length === 0) return;
      quizIndex = (quizIndex - 1 + quizPool.length) % quizPool.length;
      flipped = false;
      renderQuizCard();
    }

    prevBtn.addEventListener("click", goPrev);
    nextBtn.addEventListener("click", goNext);

    knowBtn.addEventListener("click", () => {
      if (quizPool.length === 0) return;
      const id = quizPool[quizIndex];
      markStudiedToday(id);
      setReview(id, false);
      refreshStreak();
      renderDayDots();
      refreshProgress();
      if (id === today.id) refreshTodayBtn();
      goNext();
    });

    dontKnowBtn.addEventListener("click", () => {
      if (quizPool.length === 0) return;
      const id = quizPool[quizIndex];
      setReview(id, true);
      state.days[todayKey()] = true;
      saveState();
      refreshStreak();
      renderDayDots();
      goNext();
    });

    quizSource.addEventListener("change", () => {
      buildQuizPool();
      renderQuizCard();
    });

    shuffleBtn.addEventListener("click", () => {
      shuffleArray(quizPool);
      quizIndex = 0;
      flipped = false;
      renderQuizCard();
    });

    buildQuizPool();

    /* ---------- Init ---------- */
    refreshTodayBtn();
    refreshStreak();
    refreshProgress();
    renderTermList();

    /* ---------- Install to home screen ---------- */
    const installBar = document.getElementById("installBar");
    const installBtn = document.getElementById("installBtn");
    const installText = document.getElementById("installText");
    let deferredPrompt = null;

    const standalone =
      window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!standalone) installBar.hidden = false;
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBar.hidden = true;
    });

    window.addEventListener("appinstalled", () => {
      installBar.hidden = true;
    });

    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (!standalone && isIOS) {
      installText.textContent = "공유 버튼 → '홈 화면에 추가'를 누르면 앱처럼 열려요.";
      installBtn.hidden = true;
      installBar.hidden = false;
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
