<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>자산 대시보드 · 월급 관리</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="저축, 주식, 비트코인 등 원하는 카테고리로 자산을 직접 입력하고 총자산과 변화 추이를 확인하는 대시보드" />
  <style>
    :root {
      --bg-color: #050816;
      --accent: #f97316;
      --accent-2: #22c55e;
      --accent-3: #38bdf8;
      --danger: #f87171;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --border-subtle: #1f2937;
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR",
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background: radial-gradient(circle at top, #111827 0, #020617 55%);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #0284c7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #041a2e;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.4);
    }

    .brand-text { display: flex; flex-direction: column; gap: 2px; }
    .brand-name { font-size: 18px; font-weight: 600; }
    .brand-role { font-size: 12px; color: var(--text-muted); }

    .nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-links a {
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      color: var(--text-main);
      background: rgba(15, 23, 42, 0.85);
    }

    .nav-links a:hover { border-color: var(--accent-3); color: var(--accent-3); }

    /* Summary tiles */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .summary-card {
      padding: 16px 16px 14px;
      border-radius: 18px;
      border: 1px solid var(--border-subtle);
      background: rgba(15, 23, 42, 0.92);
    }

    .summary-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .summary-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }

    .summary-value {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .summary-sub {
      font-size: 11px;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .summary-sub.up { color: var(--accent-2); }
    .summary-sub.down { color: var(--danger); }
    .summary-sub.flat { color: var(--text-muted); }

    /* Panels */
    .main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .panel {
      border-radius: 18px;
      border: 1px solid var(--border-subtle);
      background: rgba(15, 23, 42, 0.95);
      padding: 18px 18px 14px;
      margin-bottom: 20px;
    }

    .main-grid .panel { margin-bottom: 0; }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .panel-title { font-size: 14px; font-weight: 600; }
    .panel-sub { font-size: 11px; color: var(--text-muted); }

    /* Asset items */
    .asset-items-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .asset-item-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 130px 28px;
      gap: 6px;
      align-items: center;
    }

    .asset-item-row input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: rgba(2, 6, 23, 0.8);
      color: var(--text-main);
      font-size: 13px;
    }

    .asset-item-row .asset-amount {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .asset-del {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
    }

    .asset-del:hover { color: var(--danger); border-color: var(--danger); }

    .btn-add-item {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px dashed rgba(148, 163, 184, 0.5);
      background: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .btn-add-item:hover { border-color: var(--accent-3); color: var(--accent-3); }

    .asset-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      font-size: 13px;
    }

    .asset-total-value {
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Category breakdown */
    .cat-breakdown {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cat-row { display: flex; flex-direction: column; gap: 4px; }

    .cat-row-head {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      gap: 8px;
    }

    .cat-row-head .cat-name {
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cat-row-head .cat-amount {
      color: var(--text-muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .cat-bar-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.15);
      overflow: hidden;
    }

    .cat-bar-fill { height: 100%; border-radius: 999px; }

    .empty-state {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 20px 0;
    }

    /* Chart */
    .chart-wrap {
      position: relative;
      width: 100%;
      overflow-x: auto;
    }

    .chart-wrap svg {
      display: block;
      width: 100%;
      height: auto;
      min-width: 480px;
    }

    .chart-empty {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px 12px;
    }

    .tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(2, 6, 23, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.45);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text-main);
      white-space: nowrap;
      transform: translate(-50%, -110%);
      opacity: 0;
      transition: opacity 0.12s ease;
      z-index: 2;
    }

    .tooltip.visible { opacity: 1; }
    .tooltip .t-month { color: var(--text-muted); font-size: 11px; margin-bottom: 2px; }
    .tooltip .t-value { font-weight: 700; font-variant-numeric: tabular-nums; }
    .tooltip .t-net { font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 2px; }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      text-align: right;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    thead th:first-child { text-align: left; }

    tbody td {
      text-align: right;
      padding: 8px 8px;
      border-bottom: 1px solid rgba(31, 41, 55, 0.6);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    tbody td:first-child { text-align: left; font-variant-numeric: normal; }
    tbody tr:last-child td { border-bottom: none; }

    td.positive { color: var(--accent-2); }
    td.negative { color: var(--danger); }
    td.cumulative { font-weight: 700; color: var(--text-main); }

    .table-scroll { overflow-x: auto; }

    footer {
      margin-top: 28px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    @media (max-width: 768px) {
      .page { padding: 20px 16px 48px; }
      .summary-value { font-size: 18px; }
      .main-grid { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <div class="brand-logo">📈</div>
        <div class="brand-text">
          <div class="brand-name">자산 대시보드</div>
          <div class="brand-role">카테고리별 자산과 변화 추이</div>
        </div>
      </div>
      <div class="nav-links">
        <a href="salary.html">월급 관리</a>
        <a href="index.html">← 포트폴리오로</a>
      </div>
    </header>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-label"><span class="summary-dot" style="background:#38bdf8"></span>현재 총자산</div>
        <div class="summary-value" id="statTotal">0원</div>
      </div>
      <div class="summary-card">
        <div class="summary-label"><span class="summary-dot" style="background:#22c55e"></span>지난 기록 대비</div>
        <div class="summary-value" id="statChange">0원</div>
        <div class="summary-sub" id="statChangeSub"></div>
      </div>
      <div class="summary-card">
        <div class="summary-label"><span class="summary-dot" style="background:#facc15"></span>최고 기록</div>
        <div class="summary-value" id="statPeak">0원</div>
      </div>
      <div class="summary-card">
        <div class="summary-label"><span class="summary-dot" style="background:#f97316"></span>가장 큰 비중</div>
        <div class="summary-value" id="statTop">-</div>
        <div class="summary-sub" id="statTopSub"></div>
      </div>
    </div>

    <div class="main-grid">
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">자산 항목</div>
          <div class="panel-sub">원하는 이름으로 추가하세요</div>
        </div>
        <div class="asset-items-list" id="assetItemsList"></div>
        <button class="btn-add-item" id="addAssetItem" type="button">+ 항목 추가</button>
        <div class="asset-total-row">
          <span>합계</span>
          <span class="asset-total-value" id="assetItemsTotal">0원</span>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">카테고리별 비중</div>
        </div>
        <div class="cat-breakdown" id="catBreakdown">
          <div class="empty-state">항목을 추가하면 비중이 표시돼요.</div>
        </div>
      </section>
    </div>

    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">자산 증가 추이</div>
        <div class="panel-sub" id="chartRange"></div>
      </div>
      <div class="chart-wrap" id="chartWrap">
        <div class="chart-empty">자산 항목에 금액을 입력하면 추이가 기록되기 시작해요.</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">월별 자산 기록</div>
        <div class="panel-sub">최근 순 · 한 달에 한 번, 마지막 입력값이 기록돼요</div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>월</th>
              <th>총자산</th>
              <th>전월 대비</th>
            </tr>
          </thead>
          <tbody id="assetTableBody">
            <tr><td colspan="3" style="text-align:center; color: var(--text-muted);">데이터가 없어요.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer>
      데이터는 이 브라우저에만 저장됩니다 (localStorage). 다른 기기에서는 보이지 않아요.
    </footer>
  </div>

  <script>
    const STORAGE_KEY = "salaryAppData_v1";
    const PALETTE = ["#22c55e", "#38bdf8", "#f97316", "#a78bfa", "#f472b6", "#facc15", "#fb7185", "#94a3b8", "#34d399", "#60a5fa"];

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : { months: {} };
      } catch (e) {
        return { months: {} };
      }
    }

    function saveData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        // storage unavailable, ignore
      }
    }

    function genId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    let data = loadData();

    // Migrate: fold a previously-set single "starting assets" value into an item
    // so nobody loses a number they already entered.
    if (!Array.isArray(data.assetItems)) {
      if (typeof data.startingAssets === "number" && data.startingAssets > 0) {
        data.assetItems = [{ id: genId(), name: "현금", amount: data.startingAssets }];
      } else {
        data.assetItems = [
          { id: genId(), name: "저축", amount: 0 },
          { id: genId(), name: "주식", amount: 0 },
          { id: genId(), name: "비트코인", amount: 0 },
          { id: genId(), name: "현금", amount: 0 },
        ];
      }
    }
    if (typeof data.assetSnapshots !== "object" || data.assetSnapshots === null) {
      data.assetSnapshots = {};
    }

    function formatWon(n) {
      return Math.round(n).toLocaleString("ko-KR") + "원";
    }

    function formatWonShort(n) {
      const abs = Math.abs(n);
      if (abs >= 100000000) return (n / 100000000).toFixed(1) + "억";
      if (abs >= 10000) return Math.round(n / 10000) + "만";
      return Math.round(n).toLocaleString("ko-KR");
    }

    function monthLabel(key) {
      const [y, m] = key.split("-");
      return `${y}.${m}`;
    }

    function currentMonthKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }

    function colorForName(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
      return PALETTE[hash % PALETTE.length];
    }

    function totalAssets() {
      return data.assetItems.reduce((sum, it) => sum + (Number(it.amount) || 0), 0);
    }

    function recordSnapshot() {
      data.assetSnapshots[currentMonthKey()] = totalAssets();
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function buildSnapshotTimeline() {
      return Object.keys(data.assetSnapshots)
        .sort()
        .map((key) => ({ key, value: data.assetSnapshots[key] }));
    }

    function renderAssetItems() {
      const listEl = document.getElementById("assetItemsList");
      listEl.innerHTML = data.assetItems
        .map(
          (it) => `
        <div class="asset-item-row" data-id="${it.id}">
          <input type="text" class="asset-name" value="${escapeHtml(it.name)}" maxlength="20" placeholder="항목 이름" />
          <input type="number" class="asset-amount" value="${it.amount || ""}" min="0" step="10000" placeholder="0" />
          <button class="asset-del" type="button" aria-label="삭제">✕</button>
        </div>
      `
        )
        .join("");
    }

    function renderRest() {
      const total = totalAssets();
      document.getElementById("assetItemsTotal").textContent = formatWon(total);
      document.getElementById("statTotal").textContent = formatWon(total);

      // Category breakdown
      const breakdownEl = document.getElementById("catBreakdown");
      const items = data.assetItems.filter((it) => (Number(it.amount) || 0) > 0);
      if (items.length === 0) {
        breakdownEl.innerHTML = '<div class="empty-state">항목을 추가하면 비중이 표시돼요.</div>';
      } else {
        const sorted = [...items].sort((a, b) => b.amount - a.amount);
        const max = sorted[0].amount;
        breakdownEl.innerHTML = sorted
          .map((it) => {
            const pct = total > 0 ? (it.amount / total) * 100 : 0;
            const width = max > 0 ? (it.amount / max) * 100 : 0;
            const color = colorForName(it.name || "기타");
            return `
              <div class="cat-row">
                <div class="cat-row-head">
                  <span class="cat-name"><span class="summary-dot" style="background:${color}"></span>${escapeHtml(it.name || "기타")}</span>
                  <span class="cat-amount">${formatWon(it.amount)} (${pct.toFixed(1)}%)</span>
                </div>
                <div class="cat-bar-track">
                  <div class="cat-bar-fill" style="width:${width}%; background:${color}"></div>
                </div>
              </div>
            `;
          })
          .join("");
      }

      // Top category tile
      const statTop = document.getElementById("statTop");
      const statTopSub = document.getElementById("statTopSub");
      if (items.length > 0) {
        const top = [...items].sort((a, b) => b.amount - a.amount)[0];
        const pct = total > 0 ? (top.amount / total) * 100 : 0;
        statTop.textContent = top.name || "기타";
        statTopSub.textContent = `전체의 ${pct.toFixed(1)}% · ${formatWon(top.amount)}`;
      } else {
        statTop.textContent = "-";
        statTopSub.textContent = "";
      }

      // Timeline-based tiles, chart, table
      const timeline = buildSnapshotTimeline();

      const statChange = document.getElementById("statChange");
      const statChangeSub = document.getElementById("statChangeSub");
      if (timeline.length >= 2) {
        const last = timeline[timeline.length - 1];
        const prev = timeline[timeline.length - 2];
        const diff = last.value - prev.value;
        const sign = diff > 0 ? "+" : "";
        statChange.textContent = `${sign}${formatWon(diff)}`;
        if (diff > 0) {
          statChangeSub.textContent = `▲ ${monthLabel(prev.key)} → ${monthLabel(last.key)}`;
          statChangeSub.className = "summary-sub up";
        } else if (diff < 0) {
          statChangeSub.textContent = `▼ ${monthLabel(prev.key)} → ${monthLabel(last.key)}`;
          statChangeSub.className = "summary-sub down";
        } else {
          statChangeSub.textContent = "변동 없음";
          statChangeSub.className = "summary-sub flat";
        }
      } else {
        statChange.textContent = "-";
        statChangeSub.textContent = timeline.length === 1 ? "첫 기록이에요" : "";
        statChangeSub.className = "summary-sub flat";
      }

      const statPeak = document.getElementById("statPeak");
      const peak = timeline.length ? Math.max(...timeline.map((t) => t.value)) : 0;
      statPeak.textContent = formatWon(peak);

      renderTable(timeline);
      renderChart(timeline);
    }

    function renderTable(timeline) {
      const body = document.getElementById("assetTableBody");
      if (timeline.length === 0) {
        body.innerHTML = '<tr><td colspan="3" style="text-align:center; color: var(--text-muted);">데이터가 없어요.</td></tr>';
        return;
      }
      const rows = [...timeline].reverse().map((t, i, arr) => {
        const prev = arr[i + 1];
        let diffHtml = '<span style="color:var(--text-muted)">-</span>';
        if (prev) {
          const diff = t.value - prev.value;
          const cls = diff > 0 ? "positive" : diff < 0 ? "negative" : "";
          const sign = diff > 0 ? "+" : "";
          diffHtml = `<span class="${cls}">${sign}${formatWon(diff)}</span>`;
        }
        return `
          <tr>
            <td>${monthLabel(t.key)}</td>
            <td class="cumulative">${formatWon(t.value)}</td>
            <td>${diffHtml}</td>
          </tr>
        `;
      });
      body.innerHTML = rows.join("");
    }

    function renderChart(timeline) {
      const wrap = document.getElementById("chartWrap");
      const rangeEl = document.getElementById("chartRange");

      if (timeline.length === 0) {
        wrap.innerHTML = '<div class="chart-empty">자산 항목에 금액을 입력하면 추이가 기록되기 시작해요.</div>';
        rangeEl.textContent = "";
        return;
      }

      rangeEl.textContent = timeline.length === 1
        ? monthLabel(timeline[0].key)
        : `${monthLabel(timeline[0].key)} ~ ${monthLabel(timeline[timeline.length - 1].key)}`;

      const W = 640, H = 240;
      const padL = 8, padR = 8, padT = 20, padB = 28;
      const innerW = W - padL - padR;
      const innerH = H - padT - padB;

      const values = timeline.map((t) => t.value);
      let min = Math.min(...values);
      let max = Math.max(...values);
      if (min === max) { min -= Math.max(Math.abs(min) * 0.1, 1); max += Math.max(Math.abs(max) * 0.1, 1); }
      const spread = max - min;
      min -= spread * 0.08;
      max += spread * 0.08;

      const n = timeline.length;
      const xAt = (i) => n === 1 ? padL + innerW / 2 : padL + (i / (n - 1)) * innerW;
      const yAt = (v) => padT + innerH - ((v - min) / (max - min)) * innerH;

      const points = timeline.map((t, i) => [xAt(i), yAt(t.value)]);

      const linePath = points.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
      const areaPath = n === 1
        ? ""
        : linePath + ` L${points[n - 1][0].toFixed(1)},${(padT + innerH).toFixed(1)} L${points[0][0].toFixed(1)},${(padT + innerH).toFixed(1)} Z`;

      const gridLines = 3;
      let gridSvg = "";
      for (let g = 0; g <= gridLines; g++) {
        const v = min + (max - min) * (g / gridLines);
        const y = yAt(v);
        gridSvg += `
          <line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="rgba(148,163,184,0.14)" stroke-width="1" />
          <text x="${padL}" y="${(y - 4).toFixed(1)}" font-size="9" fill="#64748b">${formatWonShort(v)}</text>
        `;
      }

      const maxXLabels = 6;
      const step = Math.max(1, Math.ceil(n / maxXLabels));
      let xLabelsSvg = "";
      timeline.forEach((t, i) => {
        if (i % step === 0 || i === n - 1) {
          xLabelsSvg += `<text x="${xAt(i).toFixed(1)}" y="${H - 8}" font-size="9" fill="#64748b" text-anchor="middle">${monthLabel(t.key)}</text>`;
        }
      });

      const last = points[n - 1];
      const lastVal = timeline[n - 1].value;

      wrap.innerHTML = `
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="자산 증가 추이 차트">
          <defs>
            <linearGradient id="assetFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35" />
              <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
            </linearGradient>
          </defs>
          ${gridSvg}
          ${areaPath ? `<path d="${areaPath}" fill="url(#assetFill)" stroke="none" />` : ""}
          <path d="${linePath}" fill="none" stroke="#22c55e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
          <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="8" fill="#22c55e" opacity="0.18" />
          <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="#22c55e" />
          <text x="${Math.min(last[0] + 8, W - 60)}" y="${(last[1] - 10).toFixed(1)}" font-size="11" font-weight="700" fill="#e5e7eb">${formatWonShort(lastVal)}</text>
          ${xLabelsSvg}
          <line id="crosshair" x1="0" y1="${padT}" x2="0" y2="${padT + innerH}" stroke="rgba(148,163,184,0.5)" stroke-width="1" visibility="hidden" />
        </svg>
        <div class="tooltip" id="chartTooltip"></div>
      `;

      const svg = wrap.querySelector("svg");
      const crosshair = wrap.querySelector("#crosshair");
      const tooltip = wrap.querySelector("#chartTooltip");

      function handleMove(clientX) {
        const rect = svg.getBoundingClientRect();
        const relX = clientX - rect.left;
        const svgX = (relX / rect.width) * W;
        let idx = 0;
        let bestDist = Infinity;
        points.forEach((p, i) => {
          const d = Math.abs(p[0] - svgX);
          if (d < bestDist) { bestDist = d; idx = i; }
        });
        const p = points[idx];
        const t = timeline[idx];
        const prev = timeline[idx - 1];
        crosshair.setAttribute("x1", p[0]);
        crosshair.setAttribute("x2", p[0]);
        crosshair.setAttribute("visibility", "visible");

        const pctLeft = (p[0] / W) * 100;
        const pctTop = (p[1] / H) * 100;
        tooltip.style.left = pctLeft + "%";
        tooltip.style.top = pctTop + "%";
        let netHtml = "";
        if (prev) {
          const diff = t.value - prev.value;
          const netColor = diff > 0 ? "#22c55e" : diff < 0 ? "#f87171" : "#9ca3af";
          const sign = diff > 0 ? "+" : "";
          netHtml = `<div class="t-net" style="color:${netColor}">${sign}${formatWon(diff)}</div>`;
        }
        tooltip.innerHTML = `
          <div class="t-month">${monthLabel(t.key)}</div>
          <div class="t-value">${formatWon(t.value)}</div>
          ${netHtml}
        `;
        tooltip.classList.add("visible");
      }

      svg.addEventListener("mousemove", (e) => handleMove(e.clientX));
      svg.addEventListener("mouseleave", () => {
        crosshair.setAttribute("visibility", "hidden");
        tooltip.classList.remove("visible");
      });
      svg.addEventListener("touchmove", (e) => {
        if (e.touches[0]) handleMove(e.touches[0].clientX);
      }, { passive: true });
    }

    const listEl = document.getElementById("assetItemsList");

    listEl.addEventListener("input", (e) => {
      const row = e.target.closest(".asset-item-row");
      if (!row) return;
      const item = data.assetItems.find((it) => it.id === row.dataset.id);
      if (!item) return;
      if (e.target.classList.contains("asset-name")) {
        item.name = e.target.value;
      } else if (e.target.classList.contains("asset-amount")) {
        item.amount = Number(e.target.value) || 0;
      }
      recordSnapshot();
      saveData(data);
      renderRest();
    });

    listEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".asset-del");
      if (!btn) return;
      const row = btn.closest(".asset-item-row");
      data.assetItems = data.assetItems.filter((it) => it.id !== row.dataset.id);
      recordSnapshot();
      saveData(data);
      renderAssetItems();
      renderRest();
    });

    document.getElementById("addAssetItem").addEventListener("click", () => {
      data.assetItems.push({ id: genId(), name: "", amount: 0 });
      saveData(data);
      renderAssetItems();
      renderRest();
      const rows = listEl.querySelectorAll(".asset-name");
      if (rows.length) rows[rows.length - 1].focus();
    });

    if (totalAssets() > 0 || Object.keys(data.assetSnapshots).length > 0) {
      recordSnapshot();
      saveData(data);
    }
    renderAssetItems();
    renderRest();
  </script>
</body>
</html>
