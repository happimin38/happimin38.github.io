<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>자산 대시보드 · 월급 관리</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="월급 관리 앱에 기록된 수입과 지출을 바탕으로 지금까지의 자산 변화를 확인하는 대시보드" />
  <style>
    :root {
      --bg-color: #050816;
      --accent: #f97316;
      --accent-2: #22c55e;
      --accent-3: #38bdf8;
      --danger: #f87171;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --border-subtle: #1f2937;
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR",
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background: radial-gradient(circle at top, #111827 0, #020617 55%);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #38bdf8, #0284c7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #041a2e;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.4);
    }

    .brand-text { display: flex; flex-direction: column; gap: 2px; }
    .brand-name { font-size: 18px; font-weight: 600; }
    .brand-role { font-size: 12px; color: var(--text-muted); }

    .nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-links a {
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      color: var(--text-main);
      background: rgba(15, 23, 42, 0.85);
    }

    .nav-links a:hover { border-color: var(--accent-3); color: var(--accent-3); }

    /* Starting assets */
    .setup-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .setup-row input {
      width: 150px;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: rgba(2, 6, 23, 0.8);
      color: var(--text-main);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* Summary tiles */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .summary-card {
      padding: 16px 16px 14px;
      border-radius: 18px;
      border: 1px solid var(--border-subtle);
      background: rgba(15, 23, 42, 0.92);
    }

    .summary-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .summary-dot { width: 8px; height: 8px; border-radius: 999px; }

    .summary-value {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .summary-sub {
      font-size: 11px;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .summary-sub.up { color: var(--accent-2); }
    .summary-sub.down { color: var(--danger); }
    .summary-sub.flat { color: var(--text-muted); }

    /* Chart panel */
    .panel {
      border-radius: 18px;
      border: 1px solid var(--border-subtle);
      background: rgba(15, 23, 42, 0.95);
      padding: 18px 18px 14px;
      margin-bottom: 20px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .panel-title { font-size: 14px; font-weight: 600; }
    .panel-sub { font-size: 11px; color: var(--text-muted); }

    .chart-wrap {
      position: relative;
      width: 100%;
      overflow-x: auto;
    }

    .chart-wrap svg {
      display: block;
      width: 100%;
      height: auto;
      min-width: 480px;
    }

    .chart-empty {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      padding: 40px 12px;
    }

    .chart-empty a {
      color: var(--accent-3);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(2, 6, 23, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.45);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text-main);
      white-space: nowrap;
      transform: translate(-50%, -110%);
      opacity: 0;
      transition: opacity 0.12s ease;
      z-index: 2;
    }

    .tooltip.visible { opacity: 1; }
    .tooltip .t-month { color: var(--text-muted); font-size: 11px; margin-bottom: 2px; }
    .tooltip .t-value { font-weight: 700; font-variant-numeric: tabular-nums; }
    .tooltip .t-net { font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 2px; }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      text-align: right;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    thead th:first-child { text-align: left; }

    tbody td {
      text-align: right;
      padding: 8px 8px;
      border-bottom: 1px solid rgba(31, 41, 55, 0.6);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    tbody td:first-child { text-align: left; font-variant-numeric: normal; }

    tbody tr:last-child td { border-bottom: none; }

    td.positive { color: var(--accent-2); }
    td.negative { color: var(--danger); }
    td.cumulative { font-weight: 700; color: var(--text-main); }

    .table-scroll { overflow-x: auto; }

    footer {
      margin-top: 28px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    @media (max-width: 768px) {
      .page { padding: 20px 16px 48px; }
      .summary-value { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <div class="brand-logo">📈</div>
        <div class="brand-text">
          <div class="brand-name">자산 대시보드</div>
          <div class="brand-role">지금까지의 자산 변화</div>
        </div>
      </div>
      <div class="nav-links">
        <a href="salary.html">월급 관리</a>
        <a href="index.html">← 포트폴리오로</a>
      </div>
    </header>

    <div class="setup-row">
      시작 자산 (선택)
      <input type="number" id="startingAssetsInput" placeholder="예: 5000000" min="0" step="10000" />
    </div>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-label"><span class="summary-dot" style="background:#38bdf8"></span>현재 총자산</div>
        <div class="summary-value" id="statTotal">0원</div>
      </div>
      <div class="summary-card">
        <div class="summary-label"><span class="summary-dot" style="background:#22c55e"></span>누적 저축액</div>
        <div class="summary-value" id="statSaved">0원</div>
        <div class="summary-sub" id="statSavedSub"></div>
      </div>
      <div class="summary-card">
        <div class="summary-label"><span class="summary-dot" style="background:#facc15"></span>평균 월 저축액</div>
        <div class="summary-value" id="statAvg">0원</div>
      </div>
      <div class="summary-card">
        <div class="summary-label"><span class="summary-dot" style="background:#f97316"></span>이번 달 순저축</div>
        <div class="summary-value" id="statThisMonth">0원</div>
        <div class="summary-sub" id="statThisMonthSub"></div>
      </div>
    </div>

    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">자산 증가 추이</div>
        <div class="panel-sub" id="chartRange"></div>
      </div>
      <div class="chart-wrap" id="chartWrap">
        <div class="chart-empty" id="chartEmpty">
          아직 기록된 데이터가 없어요. <a href="salary.html">월급 관리 페이지</a>에서 월급과 지출을 먼저 입력해 주세요.
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div class="panel-title">월별 자산 내역</div>
        <div class="panel-sub">최근 순</div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>월</th>
              <th>수입</th>
              <th>지출</th>
              <th>순저축</th>
              <th>누적 자산</th>
            </tr>
          </thead>
          <tbody id="assetTableBody">
            <tr><td colspan="5" style="text-align:center; color: var(--text-muted);">데이터가 없어요.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer>
      데이터는 이 브라우저에만 저장됩니다 (localStorage). 월급 관리 페이지와 같은 저장소를 사용해요.
    </footer>
  </div>

  <script>
    const STORAGE_KEY = "salaryAppData_v1";

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : { months: {} };
      } catch (e) {
        return { months: {} };
      }
    }

    function saveData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        // storage unavailable, ignore
      }
    }

    let data = loadData();
    if (typeof data.startingAssets !== "number") data.startingAssets = 0;

    function formatWon(n) {
      return Math.round(n).toLocaleString("ko-KR") + "원";
    }

    function formatWonShort(n) {
      const abs = Math.abs(n);
      if (abs >= 100000000) return (n / 100000000).toFixed(1) + "억";
      if (abs >= 10000) return Math.round(n / 10000) + "만";
      return Math.round(n).toLocaleString("ko-KR");
    }

    function monthLabel(key) {
      const [y, m] = key.split("-");
      return `${y}.${m}`;
    }

    function buildTimeline() {
      const keys = Object.keys(data.months).sort();
      let running = data.startingAssets || 0;
      return keys.map((key) => {
        const month = data.months[key];
        const expense = (month.expenses || []).reduce((sum, e) => sum + e.amount, 0);
        const income = month.income || 0;
        const net = income - expense;
        running += net;
        return { key, income, expense, net, cumulative: running };
      });
    }

    function renderSummary(timeline) {
      const total = timeline.length ? timeline[timeline.length - 1].cumulative : (data.startingAssets || 0);
      document.getElementById("statTotal").textContent = formatWon(total);

      const totalSaved = timeline.reduce((sum, t) => sum + t.net, 0);
      const savedEl = document.getElementById("statSaved");
      savedEl.textContent = formatWon(totalSaved);
      const savedSub = document.getElementById("statSavedSub");
      savedSub.textContent = timeline.length ? `${timeline.length}개월 누적` : "";
      savedSub.className = "summary-sub flat";

      const avg = timeline.length ? totalSaved / timeline.length : 0;
      document.getElementById("statAvg").textContent = formatWon(avg);

      const thisMonthEl = document.getElementById("statThisMonth");
      const thisMonthSub = document.getElementById("statThisMonthSub");
      if (timeline.length) {
        const last = timeline[timeline.length - 1];
        thisMonthEl.textContent = formatWon(last.net);
        if (last.net > 0) {
          thisMonthSub.textContent = `▲ ${monthLabel(last.key)} 기준 저축 성공`;
          thisMonthSub.className = "summary-sub up";
        } else if (last.net < 0) {
          thisMonthSub.textContent = `▼ ${monthLabel(last.key)} 기준 지출 초과`;
          thisMonthSub.className = "summary-sub down";
        } else {
          thisMonthSub.textContent = `${monthLabel(last.key)} 기준 변동 없음`;
          thisMonthSub.className = "summary-sub flat";
        }
      } else {
        thisMonthEl.textContent = "0원";
        thisMonthSub.textContent = "";
      }
    }

    function renderTable(timeline) {
      const body = document.getElementById("assetTableBody");
      if (timeline.length === 0) {
        body.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted);">데이터가 없어요.</td></tr>';
        return;
      }
      const rows = [...timeline].reverse().map((t) => {
        const netClass = t.net > 0 ? "positive" : t.net < 0 ? "negative" : "";
        const netSign = t.net > 0 ? "+" : "";
        return `
          <tr>
            <td>${monthLabel(t.key)}</td>
            <td>${formatWon(t.income)}</td>
            <td>${formatWon(t.expense)}</td>
            <td class="${netClass}">${netSign}${formatWon(t.net)}</td>
            <td class="cumulative">${formatWon(t.cumulative)}</td>
          </tr>
        `;
      });
      body.innerHTML = rows.join("");
    }

    function renderChart(timeline) {
      const wrap = document.getElementById("chartWrap");
      const rangeEl = document.getElementById("chartRange");

      if (timeline.length === 0) {
        wrap.innerHTML = `
          <div class="chart-empty">
            아직 기록된 데이터가 없어요. <a href="salary.html">월급 관리 페이지</a>에서 월급과 지출을 먼저 입력해 주세요.
          </div>
        `;
        rangeEl.textContent = "";
        return;
      }

      rangeEl.textContent = `${monthLabel(timeline[0].key)} ~ ${monthLabel(timeline[timeline.length - 1].key)}`;

      const W = 640, H = 240;
      const padL = 8, padR = 8, padT = 20, padB = 28;
      const innerW = W - padL - padR;
      const innerH = H - padT - padB;

      const values = timeline.map((t) => t.cumulative);
      let min = Math.min(...values, data.startingAssets || 0);
      let max = Math.max(...values, data.startingAssets || 0);
      if (min === max) { min -= 1; max += 1; }
      const spread = max - min;
      min -= spread * 0.08;
      max += spread * 0.08;

      const n = timeline.length;
      const xAt = (i) => n === 1 ? padL + innerW / 2 : padL + (i / (n - 1)) * innerW;
      const yAt = (v) => padT + innerH - ((v - min) / (max - min)) * innerH;

      const points = timeline.map((t, i) => [xAt(i), yAt(t.cumulative)]);

      const linePath = points.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
      const areaPath = n === 1
        ? ""
        : linePath + ` L${points[n - 1][0].toFixed(1)},${(padT + innerH).toFixed(1)} L${points[0][0].toFixed(1)},${(padT + innerH).toFixed(1)} Z`;

      const gridLines = 3;
      let gridSvg = "";
      for (let g = 0; g <= gridLines; g++) {
        const v = min + (max - min) * (g / gridLines);
        const y = yAt(v);
        gridSvg += `
          <line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="rgba(148,163,184,0.14)" stroke-width="1" />
          <text x="${padL}" y="${(y - 4).toFixed(1)}" font-size="9" fill="#64748b" font-family="var(--font-main)">${formatWonShort(v)}</text>
        `;
      }

      const maxXLabels = 6;
      const step = Math.max(1, Math.ceil(n / maxXLabels));
      let xLabelsSvg = "";
      timeline.forEach((t, i) => {
        if (i % step === 0 || i === n - 1) {
          xLabelsSvg += `<text x="${xAt(i).toFixed(1)}" y="${H - 8}" font-size="9" fill="#64748b" text-anchor="middle">${monthLabel(t.key)}</text>`;
        }
      });

      const last = points[n - 1];
      const lastVal = timeline[n - 1].cumulative;

      wrap.innerHTML = `
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="자산 증가 추이 차트">
          <defs>
            <linearGradient id="assetFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35" />
              <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
            </linearGradient>
          </defs>
          ${gridSvg}
          ${areaPath ? `<path d="${areaPath}" fill="url(#assetFill)" stroke="none" />` : ""}
          <path d="${linePath}" fill="none" stroke="#22c55e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
          <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="8" fill="#22c55e" opacity="0.18" />
          <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="#22c55e" />
          <text x="${Math.min(last[0] + 8, W - 60)}" y="${(last[1] - 10).toFixed(1)}" font-size="11" font-weight="700" fill="#e5e7eb">${formatWonShort(lastVal)}</text>
          ${xLabelsSvg}
          <line id="crosshair" x1="0" y1="${padT}" x2="0" y2="${padT + innerH}" stroke="rgba(148,163,184,0.5)" stroke-width="1" visibility="hidden" />
        </svg>
        <div class="tooltip" id="chartTooltip"></div>
      `;

      const svg = wrap.querySelector("svg");
      const crosshair = wrap.querySelector("#crosshair");
      const tooltip = wrap.querySelector("#chartTooltip");

      function handleMove(clientX) {
        const rect = svg.getBoundingClientRect();
        const relX = clientX - rect.left;
        const svgX = (relX / rect.width) * W;
        let idx = 0;
        let bestDist = Infinity;
        points.forEach((p, i) => {
          const d = Math.abs(p[0] - svgX);
          if (d < bestDist) { bestDist = d; idx = i; }
        });
        const p = points[idx];
        const t = timeline[idx];
        crosshair.setAttribute("x1", p[0]);
        crosshair.setAttribute("x2", p[0]);
        crosshair.setAttribute("visibility", "visible");

        const pctLeft = (p[0] / W) * 100;
        const pctTop = (p[1] / H) * 100;
        tooltip.style.left = pctLeft + "%";
        tooltip.style.top = pctTop + "%";
        const netSign = t.net > 0 ? "+" : "";
        const netColor = t.net > 0 ? "#22c55e" : t.net < 0 ? "#f87171" : "#9ca3af";
        tooltip.innerHTML = `
          <div class="t-month">${monthLabel(t.key)}</div>
          <div class="t-value">${formatWon(t.cumulative)}</div>
          <div class="t-net" style="color:${netColor}">${netSign}${formatWon(t.net)}</div>
        `;
        tooltip.classList.add("visible");
      }

      svg.addEventListener("mousemove", (e) => handleMove(e.clientX));
      svg.addEventListener("mouseleave", () => {
        crosshair.setAttribute("visibility", "hidden");
        tooltip.classList.remove("visible");
      });
      svg.addEventListener("touchmove", (e) => {
        if (e.touches[0]) handleMove(e.touches[0].clientX);
      }, { passive: true });
    }

    function render() {
      const timeline = buildTimeline();
      renderSummary(timeline);
      renderTable(timeline);
      renderChart(timeline);
    }

    const startingInput = document.getElementById("startingAssetsInput");
    startingInput.value = data.startingAssets || "";
    startingInput.addEventListener("input", (e) => {
      data.startingAssets = Number(e.target.value) || 0;
      saveData(data);
      render();
    });

    render();
  </script>
</body>
</html>
