<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>머니 노트 · 월급 · 가계부 · 자산</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="월급과 지출을 기록하고 자산이 쌓이는 흐름을 확인하는 개인용 가계 도구" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#050816" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="머니 노트" />
  <style>
    :root {
      --accent: #f97316;
      --accent-2: #22c55e;
      --accent-3: #38bdf8;
      --accent-4: #a78bfa;
      --danger: #f87171;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --border-subtle: #1f2937;
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR",
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background: radial-gradient(circle at top, #111827 0, #020617 55%);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .brand { display: flex; align-items: center; gap: 14px; }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(140deg, #22c55e, #38bdf8 55%, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: #041016;
      box-shadow: 0 0 28px rgba(34, 197, 94, 0.35);
    }

    .brand-name { font-size: 19px; font-weight: 700; }
    .brand-role { font-size: 12px; color: var(--text-muted); }

    .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }

    .nav-links a {
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      color: var(--text-main);
      background: rgba(15, 23, 42, 0.85);
    }

    .nav-links a:hover { border-color: var(--accent-3); color: var(--accent-3); }

    /* This month */
    .month-strip {
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      background: rgba(15, 23, 42, 0.9);
      padding: 20px;
      margin-bottom: 20px;
    }

    .strip-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .strip-title { font-size: 14px; font-weight: 600; }
    .strip-month { font-size: 12px; color: var(--text-muted); }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat-value.up { color: var(--accent-2); }
    .stat-value.down { color: var(--danger); }

    .stat-sub { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

    /* Tool cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      background: rgba(15, 23, 42, 0.95);
      border-top: 3px solid var(--card-color);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--card-color);
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      background: color-mix(in srgb, var(--card-color) 18%, transparent);
      margin-bottom: 6px;
    }

    .card-name { font-size: 16px; font-weight: 700; }
    .card-desc { font-size: 12px; color: var(--text-muted); }

    .card-figure {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--card-color);
    }

    .card-figure-label { font-size: 11px; color: var(--text-muted); }

    /* Install hint */
    .install {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px dashed rgba(148, 163, 184, 0.45);
      background: rgba(2, 6, 23, 0.5);
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .install[hidden] { display: none; }

    .btn-install {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--accent-2);
      background: rgba(34, 197, 94, 0.12);
      color: #bbf7d0;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-install:hover { background: rgba(34, 197, 94, 0.2); }

    footer {
      margin-top: 28px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.8;
    }

    footer a { color: var(--accent-3); text-decoration: underline; text-underline-offset: 3px; }

    @media (max-width: 768px) {
      .page { padding: 20px 16px 48px; }
      .stat-value { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <div class="brand-logo">₩</div>
        <div>
          <div class="brand-name">머니 노트</div>
          <div class="brand-role">월급 · 가계부 · 자산</div>
        </div>
      </div>
      <div class="nav-links">
        <a href="english.html">영어 공부</a>
        <a href="portfolio.html">포트폴리오</a>
      </div>
    </header>

    <div class="install" id="installBar" hidden>
      <span id="installText">홈 화면에 추가하면 앱처럼 바로 열 수 있어요.</span>
      <button class="btn-install" id="installBtn" type="button">홈 화면에 추가</button>
    </div>

    <section class="month-strip">
      <div class="strip-head">
        <div class="strip-title">이번 달 요약</div>
        <div class="strip-month" id="monthLabel"></div>
      </div>
      <div class="stat-row">
        <div>
          <div class="stat-label"><span class="dot" style="background:#38bdf8"></span>총자산</div>
          <div class="stat-value" id="statAssets">0원</div>
          <div class="stat-sub" id="statAssetsSub"></div>
        </div>
        <div>
          <div class="stat-label"><span class="dot" style="background:#f97316"></span>이번 달 지출</div>
          <div class="stat-value" id="statSpent">0원</div>
          <div class="stat-sub" id="statSpentSub"></div>
        </div>
        <div>
          <div class="stat-label"><span class="dot" style="background:#22c55e"></span>저축 납입</div>
          <div class="stat-value" id="statSaved">0원</div>
          <div class="stat-sub" id="statSavedSub"></div>
        </div>
        <div>
          <div class="stat-label"><span class="dot" style="background:#a78bfa"></span>남은 금액</div>
          <div class="stat-value" id="statLeft">0원</div>
          <div class="stat-sub" id="statLeftSub"></div>
        </div>
      </div>
    </section>

    <div class="cards">
      <a class="card" href="salary.html" style="--card-color:#22c55e">
        <div class="card-icon">💵</div>
        <div class="card-name">월급 관리</div>
        <div class="card-desc">월급을 적고 이번 달 저축을 기록해요.</div>
        <div class="card-figure" id="cardSalary">-</div>
        <div class="card-figure-label">이번 달 월급</div>
      </a>

      <a class="card" href="ledger.html" style="--card-color:#f97316">
        <div class="card-icon">🧾</div>
        <div class="card-name">가계부</div>
        <div class="card-desc">쓴 돈을 카테고리별로 남겨요.</div>
        <div class="card-figure" id="cardLedger">-</div>
        <div class="card-figure-label">이번 달 지출</div>
      </a>

      <a class="card" href="dashboard.html" style="--card-color:#38bdf8">
        <div class="card-icon">📈</div>
        <div class="card-name">자산 대시보드</div>
        <div class="card-desc">저축·주식·연금을 모아서 봐요.</div>
        <div class="card-figure" id="cardAssets">-</div>
        <div class="card-figure-label">현재 총자산</div>
      </a>
    </div>

    <footer>
      기록은 이 브라우저에만 저장됩니다. 기기를 옮기거나 백업하려면
      <a href="dashboard.html">자산 대시보드 맨 아래 백업</a>을 이용하세요.
    </footer>
  </div>

  <script>
    const STORAGE_KEY = "salaryAppData_v1";

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    const data = loadData();
    const months = data.months && typeof data.months === "object" ? data.months : {};
    const groups = Array.isArray(data.assetGroups) ? data.assetGroups : [];

    function formatWon(n) {
      return Math.round(n).toLocaleString("ko-KR") + "원";
    }

    function monthKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }

    const now = new Date();
    const key = monthKey(now);
    const month = months[key] || {};

    document.getElementById("monthLabel").textContent =
      `${now.getFullYear()}년 ${now.getMonth() + 1}월`;

    // Assets: the same value model the dashboard uses.
    function itemValue(group, it) {
      if (group.type === "holding") return (Number(it.qty) || 0) * (Number(it.curPrice) || 0);
      return Number(it.amount) || 0;
    }

    const totalAssets = groups.reduce(
      (sum, g) => sum + (g.items || []).reduce((t, it) => t + itemValue(g, it), 0),
      0
    );

    const income = Number(month.income) || 0;
    const spent = (month.expenses || []).reduce((s, e) => s + (Number(e.amount) || 0), 0);
    const saved = (month.savings || []).reduce((s, e) => s + (Number(e.amount) || 0), 0);
    const left = income - spent - saved;

    document.getElementById("statAssets").textContent = formatWon(totalAssets);
    document.getElementById("statAssetsSub").textContent = groups.length
      ? `${groups.length}개 그룹`
      : "아직 등록 전";

    document.getElementById("statSpent").textContent = formatWon(spent);
    document.getElementById("statSpentSub").textContent = (month.expenses || []).length
      ? `${month.expenses.length}건`
      : "기록 없음";

    document.getElementById("statSaved").textContent = formatWon(saved);
    document.getElementById("statSavedSub").textContent = (month.savings || []).length
      ? `${month.savings.length}건`
      : "기록 없음";

    const leftEl = document.getElementById("statLeft");
    leftEl.textContent = income ? formatWon(left) : "-";
    leftEl.className = "stat-value" + (income ? (left >= 0 ? " up" : " down") : "");
    document.getElementById("statLeftSub").textContent = income
      ? "월급 − 지출 − 저축"
      : "월급을 입력해 주세요";

    document.getElementById("cardSalary").textContent = income ? formatWon(income) : "-";
    document.getElementById("cardLedger").textContent = spent ? formatWon(spent) : "-";
    document.getElementById("cardAssets").textContent = totalAssets ? formatWon(totalAssets) : "-";

    /* ---------- Install to home screen ---------- */

    const installBar = document.getElementById("installBar");
    const installBtn = document.getElementById("installBtn");
    const installText = document.getElementById("installText");
    let deferredPrompt = null;

    const standalone =
      window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

    window.addEventListener("beforeinstallprompt", (e) => {
      // Chrome lets the page raise the prompt itself once this fires.
      e.preventDefault();
      deferredPrompt = e;
      installBar.hidden = false;
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBar.hidden = true;
    });

    window.addEventListener("appinstalled", () => {
      installBar.hidden = true;
    });

    // iOS has no install prompt, so it gets the manual steps instead.
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (!standalone && isIOS) {
      installText.textContent = "공유 버튼 → '홈 화면에 추가'를 누르면 앱처럼 열려요.";
      installBtn.hidden = true;
      installBar.hidden = false;
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {
          // Offline support is a bonus; the page works without it.
        });
      });
    }
  </script>
</body>
</html>
