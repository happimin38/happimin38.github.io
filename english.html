<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>영어 습관 트래커 · 학습 저널</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="매일 배운 영어를 기록하고 학습 습관을 캘린더로 관리하는 개인용 학습 저널" />
  <link rel="icon" href="icons/icon-english-192.png" type="image/png" />
  <link rel="manifest" href="manifest-english.json" />
  <meta name="theme-color" content="#2a1410" />
  <link rel="apple-touch-icon" href="icons/icon-english-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="영어 습관 트래커" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --leather: #2a1410;
      --parchment: #f8efdd;
      --parchment-2: #f0e2c8;
      --parchment-3: #e7d6b4;
      --hairline: rgba(184, 134, 60, 0.3);
      --hairline-soft: rgba(184, 134, 60, 0.16);
      --ink: #2b1a12;
      --ink-soft: #6b5645;
      --ink-faint: #8a7a63;

      --gold: #b8863c;
      --gold-strong: #d9a857;
      --gold-ink: #2a1410;

      --good: #4b6b4f;
      --warn: #8a3b2e;

      --cat-vocab: #b8863c;
      --cat-grammar: #4a5578;
      --cat-listening: #4b6b4f;
      --cat-reading: #8a3b2e;
      --cat-speaking: #6b4066;
      --cat-writing: #6b6b3c;
      --cat-etc: #7a6b58;

      --font-display: "Cormorant Garamond", "Noto Serif KR", Georgia, serif;
      --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Noto Sans KR", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    a { color: var(--gold); text-decoration: none; }
    a:hover { color: var(--gold-strong); }

    body {
      font-family: var(--font-body);
      background: var(--leather);
      background-image:
        radial-gradient(ellipse 900px 500px at 50% 0%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.35) 100%),
        radial-gradient(ellipse 1400px 900px at 50% 10%, #3a1d16 0%, #2a1410 55%, #1d0d0a 100%);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
    }

    .desk { padding: 40px 20px 64px; }

    .sheet {
      max-width: 900px;
      margin: 0 auto;
      background: linear-gradient(180deg, #f8efdd 0%, #f3e6cd 100%);
      border-radius: 8px;
      padding: 36px 32px 44px;
      box-shadow:
        0 40px 80px -30px rgba(10, 4, 2, 0.75),
        0 2px 0 rgba(255, 255, 255, 0.5) inset,
        0 0 0 1px rgba(184, 134, 60, 0.15);
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-bottom: 24px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--hairline);
    }

    .seal {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 35% 30%, #fbf3e2 0%, #f3e6cd 70%);
      border: 1.5px solid var(--gold);
      box-shadow: 0 0 0 4px var(--parchment), 0 0 0 5px var(--hairline);
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 600;
      font-size: 19px;
      color: var(--gold);
    }

    .titles h1 {
      font-size: 19px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .titles p {
      margin-top: 3px;
      font-family: var(--font-display);
      font-style: italic;
      font-size: 14.5px;
      color: var(--ink-soft);
    }

    .top-nav { margin-left: auto; }

    .top-nav a {
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.4);
    }

    .top-nav a:hover { border-color: var(--gold); color: var(--warn); }

    /* Layout */
    .top-grid { display: grid; grid-template-columns: 1fr; gap: 32px; margin-bottom: 32px; }

    .section-title {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .section-title .count { text-transform: none; letter-spacing: 0; }

    section + .section-title,
    .card + .section-title,
    .top-grid + .section-title,
    .log-list + .section-title {
      margin-top: 32px;
      padding-top: 28px;
      border-top: 1px solid var(--hairline);
    }

    /* Streak hero */
    .streak-panel { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }

    .flame-icon { flex-shrink: 0; }

    .streak-figure {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 600;
      font-size: 48px;
      line-height: 0.9;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .streak-figure .unit {
      font-family: var(--font-body);
      font-style: normal;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-soft);
      margin-left: 4px;
    }

    .streak-caption { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }

    .ledger { display: flex; flex-direction: column; }

    .ledger-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 0;
      border-top: 1px solid var(--hairline);
      font-size: 13px;
      color: var(--ink-soft);
    }

    .ledger-row dd {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .goal-edit {
      display: flex;
      align-items: center;
      gap: 3px;
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 11px;
      color: var(--ink-faint);
    }

    .goal-edit input {
      width: 32px;
      background: rgba(184, 134, 60, 0.08);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 3px 4px;
      text-align: center;
    }

    /* Calendar */
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .cal-nav-btns { display: flex; align-items: center; gap: 10px; }

    .cal-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid var(--hairline);
      background: rgba(184, 134, 60, 0.08);
      color: var(--ink);
      font-size: 14px;
      cursor: pointer;
    }

    .cal-btn:hover { border-color: var(--gold); color: var(--warn); }

    .cal-label {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 600;
      font-size: 17px;
      min-width: 90px;
      text-align: center;
      color: var(--ink);
    }

    .cal-today-btn {
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: rgba(184, 134, 60, 0.08);
      color: var(--ink-soft);
      cursor: pointer;
    }

    .cal-today-btn:hover { border-color: var(--gold); color: var(--warn); }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .cal-weekday {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--ink-faint);
      padding-bottom: 8px;
    }

    .cal-weekday.sun { color: var(--warn); }
    .cal-weekday.sat { color: var(--cat-grammar); }

    .cal-day {
      position: relative;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      border: 1px solid transparent;
      background: rgba(184, 134, 60, 0.06);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }

    .cal-day.blank { visibility: hidden; cursor: default; background: none; }
    .cal-day:hover { border-color: var(--hairline); background: rgba(184, 134, 60, 0.14); }
    .cal-day.today { border-color: var(--gold); font-weight: 700; background: var(--parchment); }
    .cal-day.done {
      background: rgba(75, 107, 79, 0.16);
      color: #2f4531;
      font-weight: 700;
    }
    .cal-day.selected { outline: 2px solid var(--cat-speaking); outline-offset: 1px; }

    .cal-day .dot {
      position: absolute;
      bottom: 4px;
      right: 5px;
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: var(--gold);
    }

    .cal-check {
      position: absolute;
      bottom: 4px;
      right: 5px;
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: var(--good);
    }

    /* Cards: today panel + form */
    .card {
      position: relative;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 22px 24px;
      background: rgba(255, 255, 255, 0.35);
    }

    .card-tab {
      position: absolute;
      top: -12px;
      left: 20px;
      background: var(--gold);
      color: var(--gold-ink);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .day-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .day-panel-date {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 19px;
      font-weight: 600;
      color: var(--ink);
    }

    .check-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--ink-soft);
      cursor: pointer;
    }

    .check-toggle input { width: 16px; height: 16px; accent-color: var(--good); cursor: pointer; }

    .day-entries { display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px; }

    .empty-hint { font-size: 12.5px; color: var(--ink-faint); padding: 4px 0; }

    .add-here-btn {
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px dashed var(--gold);
      background: transparent;
      color: var(--warn);
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }

    .add-here-btn:hover { background: rgba(184, 134, 60, 0.1); }

    /* Form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }

    .field label {
      font-size: 10.5px;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .field input,
    .field select,
    .field textarea {
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      color: var(--ink);
      font-size: 13.5px;
      padding: 10px 12px;
      font-family: var(--font-body);
    }

    .field input,
    .field select { font-family: var(--font-mono); }

    .field textarea {
      resize: vertical;
      min-height: 84px;
      font-family: var(--font-body);
      line-height: 1.9;
      background-image: repeating-linear-gradient(
        rgba(255, 255, 255, 0.55) 0,
        rgba(255, 255, 255, 0.55) 1.85em,
        var(--hairline-soft) 1.85em,
        var(--hairline-soft) calc(1.85em + 1px)
      );
      background-attachment: local;
    }

    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    .form-actions { display: flex; gap: 8px; margin-top: 16px; }

    .btn-primary {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      background: var(--gold);
      color: var(--gold-ink);
      font-weight: 700;
      font-size: 13.5px;
      letter-spacing: 0.02em;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary:hover { background: var(--gold-strong); }

    .btn-cancel {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--hairline);
      background: transparent;
      color: var(--ink-soft);
      font-size: 13.5px;
      cursor: pointer;
      font-family: inherit;
    }

    /* Log list (timeline) */
    .log-list { display: flex; flex-direction: column; gap: 22px; }

    .log-item {
      position: relative;
      padding: 4px 8px 4px 20px;
      margin-left: -8px;
      border-left: 1.5px solid var(--cat-color, var(--hairline));
      border-radius: 0 8px 8px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .log-item:hover { background: color-mix(in srgb, var(--cat-color, var(--gold)) 8%, transparent); }
    .log-item:hover .log-edit-hint { opacity: 1; }

    .log-item::before {
      content: "";
      position: absolute;
      left: -5.5px;
      top: 9px;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--cat-color, var(--hairline));
      border: 2px solid var(--parchment);
    }

    .log-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .log-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .log-date {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink-faint);
      font-variant-numeric: tabular-nums;
    }

    .badge {
      font-family: var(--font-body);
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 4px;
      font-weight: 600;
      white-space: nowrap;
    }

    .log-edit-hint {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--ink-faint);
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .log-title {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 17px;
      font-weight: 600;
      color: var(--ink);
    }

    .log-content { font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: var(--ink-soft); }

    .log-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--warn);
      padding: 4px 11px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
      background: color-mix(in srgb, var(--warn) 10%, transparent);
    }

    .log-link:hover { background: color-mix(in srgb, var(--warn) 18%, transparent); }

    .log-actions { display: flex; align-items: center; gap: 12px; }

    .icon-btn {
      font-family: var(--font-body);
      font-size: 11.5px;
      padding: 0;
      border: none;
      background: none;
      color: var(--ink-faint);
      cursor: pointer;
    }

    .icon-btn:hover { color: var(--warn); text-decoration: underline; }

    .backup-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .backup-row .icon-btn {
      padding: 7px 12px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      color: var(--ink-soft);
    }
    .backup-row .icon-btn:hover { border-color: var(--gold); color: var(--warn); text-decoration: none; }

    footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--hairline);
      text-align: center;
      font-family: var(--font-display);
      font-style: italic;
      font-size: 13px;
      color: var(--ink-faint);
    }

    /* Install bar */
    .install {
      max-width: 900px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px dashed var(--hairline);
      background: rgba(0, 0, 0, 0.15);
      font-size: 12px;
      color: var(--parchment-2);
    }

    .install[hidden] { display: none; }

    .btn-install {
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid var(--gold);
      background: rgba(184, 134, 60, 0.18);
      color: var(--gold-strong);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-install:hover { background: rgba(184, 134, 60, 0.3); }

    @media (min-width: 760px) {
      .top-grid { grid-template-columns: 260px 1fr; align-items: start; }
    }

    @media (max-width: 480px) {
      .desk { padding: 24px 12px 48px; }
      .sheet { padding: 26px 18px 34px; }
      .form-grid { grid-template-columns: 1fr; }
      .cal-day { font-size: 11px; }
      .streak-figure { font-size: 38px; }

      header { flex-wrap: wrap; }
      .titles { min-width: 0; }
      .top-nav { margin-left: 0; width: 100%; order: 1; }
    }
  </style>
</head>
<body>
  <div class="desk">
    <div class="install" id="installBar" hidden>
      <span id="installText">홈 화면에 추가하면 앱처럼 바로 열 수 있어요.</span>
      <button class="btn-install" id="installBtn" type="button">홈 화면에 추가</button>
    </div>

    <div class="sheet">
      <header>
        <div class="seal">EN</div>
        <div class="titles">
          <h1>영어 습관 트래커</h1>
          <p>매일 배운 것을 적고, 공부한 날에 표시하세요</p>
        </div>
        <nav class="top-nav">
          <a href="index.html">← 홈</a>
        </nav>
      </header>

      <div class="top-grid">
        <div>
          <div class="section-title">이번 달 현황</div>
          <div class="streak-panel">
            <svg class="flame-icon" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
              <defs>
                <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="var(--gold-strong)" />
                  <stop offset="1" stop-color="var(--warn)" />
                </linearGradient>
              </defs>
              <path
                fill="url(#flameGrad)"
                d="M12.963 2.286a.75.75 0 00-1.071-.136 9.742 9.742 0 00-3.539 6.176 7.547 7.547 0 01-1.705-1.715.75.75 0 00-1.152-.082A9 9 0 1015.68 4.534a7.46 7.46 0 01-2.717-2.248zM15.75 14.25a3.75 3.75 0 11-7.313-1.172c.628.465 1.35.81 2.133 1a5.99 5.99 0 011.925-3.545 3.75 3.75 0 013.255 3.717z"
              />
            </svg>
            <div>
              <div class="streak-figure" id="statStreak">0<span class="unit">일째</span></div>
              <div class="streak-caption">연속 학습 중</div>
            </div>
          </div>
          <dl class="ledger">
            <div class="ledger-row">
              <dt>최장 기록</dt>
              <dd id="statLongest">0일</dd>
            </div>
            <div class="ledger-row">
              <dt>이번 달 학습일</dt>
              <dd id="statMonth">0/0일</dd>
            </div>
            <div class="ledger-row">
              <dt>이번 주 목표</dt>
              <dd>
                <span id="statWeek">0/0일</span>
                <span class="goal-edit">· 목표 <input type="number" id="goalInput" min="1" max="7" /></span>
              </dd>
            </div>
          </dl>
        </div>

        <div>
          <div class="cal-nav">
            <div class="cal-nav-btns">
              <button class="cal-btn" id="prevMonthBtn" aria-label="이전 달">‹</button>
              <div class="cal-label" id="calLabel"></div>
              <button class="cal-btn" id="nextMonthBtn" aria-label="다음 달">›</button>
            </div>
            <button class="cal-today-btn" id="gotoTodayBtn" type="button">오늘</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
      </div>

      <div class="section-title">오늘의 카드</div>
      <div class="card" id="dayCard">
        <div class="day-panel-head">
          <div class="day-panel-date" id="dayPanelDate"></div>
          <label class="check-toggle">
            <input type="checkbox" id="dayDoneCheck" />
            공부 완료로 표시
          </label>
        </div>
        <div class="day-entries" id="dayEntries"></div>
        <button class="add-here-btn" id="addHereBtn" type="button">+ 이 날짜로 기록 추가</button>
      </div>

      <div class="section-title" id="formTitle">오늘 배운 내용 기록하기</div>
      <div class="card">
        <form id="logForm">
          <div class="form-grid">
            <div class="field">
              <label for="fDate">날짜</label>
              <input type="date" id="fDate" required />
            </div>
            <div class="field">
              <label for="fCategory">분야</label>
              <select id="fCategory"></select>
            </div>
            <div class="field full">
              <label for="fTitle">한 줄 요약 (선택)</label>
              <input type="text" id="fTitle" placeholder="예) 가정법 과거완료 정리" />
            </div>
            <div class="field full">
              <label for="fLink">유튜브 링크 (선택)</label>
              <input type="url" id="fLink" placeholder="https://youtube.com/watch?v=..." />
            </div>
            <div class="field full">
              <label for="fContent">오늘 배운 내용</label>
              <textarea id="fContent" placeholder="예) 문장 5개 직접 만들어봄. if I had known, I would have gone. 등" required></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary" id="submitBtn">기록 저장</button>
            <button type="button" class="btn-cancel" id="cancelEditBtn" hidden>취소</button>
          </div>
        </form>
      </div>

      <div class="section-title">
        <span>학습 기록</span>
        <span class="count" id="logCount"></span>
      </div>
      <div class="log-list" id="logList"></div>

      <div class="section-title">백업</div>
      <div class="backup-row">
        <button class="icon-btn" id="exportBtn" type="button">내보내기 (JSON)</button>
        <button class="icon-btn" id="importBtn" type="button">가져오기</button>
        <input type="file" id="importFile" accept="application/json" hidden />
      </div>

      <footer>Recorded in this journal, one page at a time.</footer>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "englishHabitApp_v1";

    const CATEGORIES = [
      { value: "vocab", label: "단어", color: "var(--cat-vocab)" },
      { value: "grammar", label: "문법", color: "var(--cat-grammar)" },
      { value: "listening", label: "듣기", color: "var(--cat-listening)" },
      { value: "reading", label: "리딩", color: "var(--cat-reading)" },
      { value: "speaking", label: "스피킹", color: "var(--cat-speaking)" },
      { value: "writing", label: "라이팅", color: "var(--cat-writing)" },
      { value: "etc", label: "기타", color: "var(--cat-etc)" },
    ];

    function categoryInfo(value) {
      return CATEGORIES.find((c) => c.value === value) || CATEGORIES[CATEGORIES.length - 1];
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const d = raw ? JSON.parse(raw) : {};
        return {
          entries: Array.isArray(d.entries) ? d.entries : [],
          checks: d.checks && typeof d.checks === "object" ? d.checks : {},
          weeklyGoal: Number(d.weeklyGoal) > 0 ? Number(d.weeklyGoal) : 5,
        };
      } catch (e) {
        return { entries: [], checks: {}, weeklyGoal: 5 };
      }
    }

    let data = loadData();

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function pad(n) { return String(n).padStart(2, "0"); }
    function toKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
    function fromKey(k) {
      const [y, m, d] = k.split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    function startOfDay(d) { const c = new Date(d); c.setHours(0, 0, 0, 0); return c; }
    function todayKey() { return toKey(new Date()); }

    const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

    let viewDate = startOfDay(new Date());
    let selectedKey = todayKey();
    let editingId = null;

    /* ---------- Streaks & stats ---------- */

    function computeStreaks() {
      const trueKeys = Object.keys(data.checks).filter((k) => data.checks[k]).sort();
      let longest = 0, run = 0, prev = null;
      for (const key of trueKeys) {
        const d = fromKey(key);
        run = prev && d - prev === 86400000 ? run + 1 : 1;
        longest = Math.max(longest, run);
        prev = d;
      }

      let current = 0;
      let cursor = startOfDay(new Date());
      if (!data.checks[toKey(cursor)]) cursor.setDate(cursor.getDate() - 1);
      while (data.checks[toKey(cursor)]) {
        current += 1;
        cursor.setDate(cursor.getDate() - 1);
      }
      return { current, longest };
    }

    function weekRange(date) {
      const d = startOfDay(date);
      const day = d.getDay();
      const diffToMonday = day === 0 ? -6 : 1 - day;
      const monday = new Date(d);
      monday.setDate(d.getDate() + diffToMonday);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      return { monday, sunday };
    }

    function renderStats() {
      const { current, longest } = computeStreaks();
      document.getElementById("statStreak").innerHTML = `${current}<span class="unit">일째</span>`;
      document.getElementById("statLongest").innerHTML = `${longest}<span class="unit">일</span>`;

      const now = new Date();
      const monthPrefix = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const monthDone = Object.keys(data.checks).filter(
        (k) => k.startsWith(monthPrefix) && data.checks[k]
      ).length;
      document.getElementById("statMonth").innerHTML = `${monthDone}<span class="unit">/${daysInMonth}일</span>`;

      const { monday, sunday } = weekRange(now);
      let weekDone = 0;
      for (let d = new Date(monday); d <= sunday; d.setDate(d.getDate() + 1)) {
        if (data.checks[toKey(d)]) weekDone += 1;
      }
      document.getElementById("statWeek").innerHTML = `${weekDone}<span class="unit">/${data.weeklyGoal}일</span>`;
      document.getElementById("goalInput").value = data.weeklyGoal;
    }

    /* ---------- Calendar ---------- */

    function renderCalendar() {
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      document.getElementById("calLabel").textContent = `${year}년 ${month + 1}월`;

      const grid = document.getElementById("calGrid");
      grid.innerHTML = "";

      WEEKDAYS.forEach((label, i) => {
        const el = document.createElement("div");
        el.className = "cal-weekday" + (i === 0 ? " sun" : i === 6 ? " sat" : "");
        el.textContent = label;
        grid.appendChild(el);
      });

      const firstWeekday = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const tKey = todayKey();

      for (let i = 0; i < firstWeekday; i++) {
        const blank = document.createElement("div");
        blank.className = "cal-day blank";
        grid.appendChild(blank);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const key = `${year}-${pad(month + 1)}-${pad(day)}`;
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cal-day";
        if (key === tKey) cell.classList.add("today");
        if (data.checks[key]) cell.classList.add("done");
        if (key === selectedKey) cell.classList.add("selected");
        cell.textContent = String(day);

        if (data.checks[key]) {
          const check = document.createElement("span");
          check.className = "cal-check";
          cell.appendChild(check);
        } else if (data.entries.some((e) => e.date === key)) {
          const dot = document.createElement("span");
          dot.className = "dot";
          cell.appendChild(dot);
        }

        cell.addEventListener("click", () => {
          selectedKey = key;
          fDate.value = key;
          renderCalendar();
          renderDayPanel();
        });
        grid.appendChild(cell);
      }
    }

    function formatDateLabel(key) {
      const d = fromKey(key);
      return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
    }

    /* ---------- Day panel ---------- */

    function renderDayPanel() {
      document.getElementById("dayPanelDate").textContent = formatDateLabel(selectedKey);
      const checkbox = document.getElementById("dayDoneCheck");
      checkbox.checked = !!data.checks[selectedKey];

      const list = document.getElementById("dayEntries");
      list.innerHTML = "";
      const dayEntries = data.entries.filter((e) => e.date === selectedKey);

      if (!dayEntries.length) {
        const hint = document.createElement("div");
        hint.className = "empty-hint";
        hint.textContent = "이 날짜에 기록된 학습 내용이 없어요.";
        list.appendChild(hint);
      } else {
        dayEntries.forEach((entry) => list.appendChild(buildLogItem(entry)));
      }
    }

    /* ---------- Log list ---------- */

    function buildLogItem(entry) {
      const cat = categoryInfo(entry.category);
      const item = document.createElement("div");
      item.className = "log-item";
      item.style.setProperty("--cat-color", cat.color);

      const head = document.createElement("div");
      head.className = "log-item-head";

      const meta = document.createElement("div");
      meta.className = "log-meta";

      const dateEl = document.createElement("span");
      dateEl.className = "log-date";
      dateEl.textContent = formatDateLabel(entry.date);
      meta.appendChild(dateEl);

      const badge = document.createElement("span");
      badge.className = "badge";
      badge.style.background = `color-mix(in srgb, ${cat.color} 22%, transparent)`;
      badge.style.color = cat.color;
      badge.textContent = cat.label;
      meta.appendChild(badge);

      head.appendChild(meta);

      const actions = document.createElement("div");
      actions.className = "log-actions";

      const editHint = document.createElement("span");
      editHint.className = "log-edit-hint";
      editHint.textContent = "클릭해서 수정";
      actions.appendChild(editHint);

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "icon-btn";
      delBtn.textContent = "삭제";
      delBtn.addEventListener("click", () => deleteEntry(entry.id));
      actions.appendChild(delBtn);

      head.appendChild(actions);
      item.appendChild(head);

      if (entry.title) {
        const title = document.createElement("div");
        title.className = "log-title";
        title.textContent = entry.title;
        item.appendChild(title);
      }

      if (entry.content) {
        const content = document.createElement("div");
        content.className = "log-content";
        content.textContent = entry.content;
        item.appendChild(content);
      }

      if (entry.link && /^https?:\/\//i.test(entry.link)) {
        const link = document.createElement("a");
        link.className = "log-link";
        link.href = entry.link;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.innerHTML =
          '<svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="M4 2.5L13 8L4 13.5V2.5Z" fill="currentColor"/></svg> 영상 보기';
        item.appendChild(link);
      }

      item.addEventListener("click", (e) => {
        if (e.target.closest("button, a")) return;
        startEdit(entry.id);
      });

      return item;
    }

    function renderLogList() {
      const list = document.getElementById("logList");
      list.innerHTML = "";

      const sorted = [...data.entries].sort((a, b) => {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        return b.id.localeCompare(a.id);
      });

      document.getElementById("logCount").textContent = sorted.length ? `총 ${sorted.length}건` : "";

      if (!sorted.length) {
        const hint = document.createElement("div");
        hint.className = "empty-hint";
        hint.textContent = "아직 기록이 없어요. 오늘 배운 내용을 남겨보세요.";
        list.appendChild(hint);
        return;
      }

      sorted.forEach((entry) => list.appendChild(buildLogItem(entry)));
    }

    /* ---------- Form ---------- */

    const form = document.getElementById("logForm");
    const fDate = document.getElementById("fDate");
    const fCategory = document.getElementById("fCategory");
    const fTitle = document.getElementById("fTitle");
    const fLink = document.getElementById("fLink");
    const fContent = document.getElementById("fContent");
    const submitBtn = document.getElementById("submitBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const formTitle = document.getElementById("formTitle");

    CATEGORIES.forEach((c) => {
      const opt = document.createElement("option");
      opt.value = c.value;
      opt.textContent = c.label;
      fCategory.appendChild(opt);
    });

    function resetForm() {
      editingId = null;
      form.reset();
      fDate.value = selectedKey;
      fCategory.value = CATEGORIES[0].value;
      submitBtn.textContent = "기록 저장";
      formTitle.textContent = "오늘 배운 내용 기록하기";
      cancelEditBtn.hidden = true;
    }

    function startEdit(id) {
      const entry = data.entries.find((e) => e.id === id);
      if (!entry) return;
      editingId = id;
      fDate.value = entry.date;
      fCategory.value = entry.category;
      fTitle.value = entry.title || "";
      fLink.value = entry.link || "";
      fContent.value = entry.content || "";
      submitBtn.textContent = "수정 저장";
      formTitle.textContent = "기록 수정하기";
      cancelEditBtn.hidden = false;
      form.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function deleteEntry(id) {
      if (!confirm("이 기록을 삭제할까요?")) return;
      data.entries = data.entries.filter((e) => e.id !== id);
      saveData();
      renderAll();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const date = fDate.value || todayKey();
      const title = fTitle.value.trim();
      const link = fLink.value.trim();
      const content = fContent.value.trim();
      if (!content) return;

      if (editingId) {
        const entry = data.entries.find((en) => en.id === editingId);
        if (entry) {
          entry.date = date;
          entry.category = fCategory.value;
          entry.title = title;
          entry.link = link;
          entry.content = content;
        }
      } else {
        data.entries.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          date,
          category: fCategory.value,
          title,
          link,
          content,
        });
      }

      data.checks[date] = true;
      saveData();
      selectedKey = date;
      resetForm();
      renderAll();
    });

    cancelEditBtn.addEventListener("click", resetForm);

    document.getElementById("addHereBtn").addEventListener("click", () => {
      resetForm();
      fDate.value = selectedKey;
      fContent.focus();
    });

    document.getElementById("dayDoneCheck").addEventListener("change", (e) => {
      if (e.target.checked) data.checks[selectedKey] = true;
      else delete data.checks[selectedKey];
      saveData();
      renderCalendar();
      renderStats();
    });

    document.getElementById("goalInput").addEventListener("change", (e) => {
      const val = Math.min(7, Math.max(1, Number(e.target.value) || 5));
      data.weeklyGoal = val;
      saveData();
      renderStats();
    });

    /* ---------- Calendar nav ---------- */

    document.getElementById("prevMonthBtn").addEventListener("click", () => {
      viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
      renderCalendar();
    });

    document.getElementById("nextMonthBtn").addEventListener("click", () => {
      viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
      renderCalendar();
    });

    document.getElementById("gotoTodayBtn").addEventListener("click", () => {
      viewDate = startOfDay(new Date());
      selectedKey = todayKey();
      fDate.value = selectedKey;
      renderCalendar();
      renderDayPanel();
    });

    /* ---------- Backup ---------- */

    document.getElementById("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `english-habit-backup-${todayKey()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    const importFile = document.getElementById("importFile");
    document.getElementById("importBtn").addEventListener("click", () => importFile.click());

    importFile.addEventListener("change", () => {
      const file = importFile.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!confirm("가져온 데이터로 현재 기록을 덮어쓸까요?")) return;
          data = {
            entries: Array.isArray(parsed.entries) ? parsed.entries : [],
            checks: parsed.checks && typeof parsed.checks === "object" ? parsed.checks : {},
            weeklyGoal: Number(parsed.weeklyGoal) > 0 ? Number(parsed.weeklyGoal) : 5,
          };
          saveData();
          renderAll();
        } catch (e) {
          alert("올바른 백업 파일이 아니에요.");
        }
      };
      reader.readAsText(file);
      importFile.value = "";
    });

    /* ---------- Render all ---------- */

    function renderAll() {
      renderStats();
      renderCalendar();
      renderDayPanel();
      renderLogList();
    }

    fDate.value = selectedKey;
    fCategory.value = CATEGORIES[0].value;
    renderAll();

    /* ---------- Install to home screen ---------- */

    const installBar = document.getElementById("installBar");
    const installBtn = document.getElementById("installBtn");
    const installText = document.getElementById("installText");
    let deferredPrompt = null;

    const standalone =
      window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!standalone) installBar.hidden = false;
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBar.hidden = true;
    });

    window.addEventListener("appinstalled", () => {
      installBar.hidden = true;
    });

    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (!standalone && isIOS) {
      installText.textContent = "공유 버튼 → '홈 화면에 추가'를 누르면 앱처럼 열려요.";
      installBtn.hidden = true;
      installBar.hidden = false;
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
