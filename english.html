<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>영어 습관 트래커 · 학습 기록</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="매일 배운 영어를 기록하고 학습 습관을 캘린더로 관리하는 개인용 도구" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#171310" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --ink-bg: #171310;
      --paper: #211b16;
      --paper-2: #2a231c;
      --paper-3: #332b21;
      --hairline: #3d3226;
      --hairline-soft: #2c2419;
      --text: #f1e8d8;
      --text-dim: #b3a58e;
      --text-faint: #85795f;

      --accent: #eab040;
      --accent-strong: #f4c766;
      --accent-ink: #241a08;

      --good: #8bab6e;
      --warn: #d97757;

      --cat-vocab: #eab040;
      --cat-grammar: #8fa0d1;
      --cat-listening: #74b28f;
      --cat-reading: #d97757;
      --cat-speaking: #c98fb8;
      --cat-writing: #a3b578;
      --cat-etc: #9c8f79;

      --font-display: "Fraunces", "Noto Serif KR", Georgia, serif;
      --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Noto Sans KR", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--ink-bg);
      background-image:
        radial-gradient(ellipse 900px 500px at 15% -10%, rgba(234, 176, 64, 0.08), transparent 60%),
        radial-gradient(ellipse 700px 500px at 100% 10%, rgba(201, 143, 184, 0.06), transparent 60%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .page { max-width: 900px; margin: 0 auto; padding: 36px 20px 80px; }

    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 28px;
    }

    .mark {
      position: relative;
      flex-shrink: 0;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px dashed var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper-2);
      transform: rotate(-8deg);
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 600;
      font-size: 20px;
      color: var(--accent-strong);
    }

    .mark::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid var(--accent);
      border-radius: 50%;
      opacity: 0.45;
    }

    .titles h1 {
      font-family: var(--font-body);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .titles p {
      font-size: 12.5px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .top-nav { margin-left: auto; }

    .top-nav a {
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--hairline);
      color: var(--text-dim);
      background: var(--paper);
    }

    .top-nav a:hover { border-color: var(--accent); color: var(--accent-strong); }

    /* Layout */
    .top-grid { display: grid; grid-template-columns: 1fr; gap: 18px; margin-bottom: 18px; }

    section {
      border-radius: 16px;
      border: 1px solid var(--hairline);
      background: var(--paper);
      padding: 22px;
    }

    section + section { margin-top: 18px; }
    .top-grid section { margin-top: 0; }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .section-title .count {
      font-family: var(--font-mono);
      text-transform: none;
      letter-spacing: 0;
      color: var(--text-faint);
      font-size: 12px;
    }

    /* Streak hero */
    .streak-panel { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }

    .flame-icon { flex-shrink: 0; }

    .streak-figure {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 44px;
      line-height: 1;
      color: var(--accent-strong);
      font-variant-numeric: tabular-nums;
    }

    .streak-figure .unit {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dim);
      margin-left: 4px;
    }

    .streak-caption { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

    .ledger { display: flex; flex-direction: column; }

    .ledger-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px dashed var(--hairline);
      font-size: 13px;
    }

    .ledger-row dt { color: var(--text-dim); }

    .ledger-row dd {
      font-family: var(--font-mono);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .goal-edit {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 11px;
      color: var(--text-faint);
    }

    .goal-edit input {
      width: 32px;
      background: var(--paper-2);
      border: 1px solid var(--hairline);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 3px 4px;
      text-align: center;
    }

    /* Calendar */
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .cal-nav-btns { display: flex; align-items: center; gap: 10px; }

    .cal-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--hairline);
      background: var(--paper-2);
      color: var(--text);
      font-size: 15px;
      cursor: pointer;
    }

    .cal-btn:hover { border-color: var(--accent); color: var(--accent-strong); }

    .cal-label {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 15px;
      min-width: 96px;
      text-align: center;
    }

    .cal-today-btn {
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: var(--paper-2);
      color: var(--text-dim);
      cursor: pointer;
    }

    .cal-today-btn:hover { border-color: var(--accent); color: var(--accent-strong); }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-weekday {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.04em;
      color: var(--text-faint);
      padding-bottom: 8px;
    }

    .cal-weekday.sun { color: var(--warn); }
    .cal-weekday.sat { color: var(--cat-grammar); }

    .cal-day {
      position: relative;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid transparent;
      background: var(--paper-2);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }

    .cal-day.blank { visibility: hidden; cursor: default; background: none; }
    .cal-day:hover { border-color: var(--hairline); background: var(--paper-3); }
    .cal-day.today { border-color: var(--accent); color: var(--accent-strong); font-weight: 600; }
    .cal-day.done {
      background: color-mix(in srgb, var(--good) 22%, var(--paper-2));
      color: #dcefce;
      font-weight: 600;
    }
    .cal-day.done::after {
      content: "✓";
      position: absolute;
      bottom: 1px;
      right: 3px;
      font-size: 8px;
      color: var(--good);
    }
    .cal-day.selected { outline: 2px solid var(--cat-speaking); outline-offset: 1px; }

    .cal-day .dot {
      position: absolute;
      bottom: 4px;
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: var(--accent);
    }

    /* Day panel */
    .day-card {
      position: relative;
      border-style: dashed;
    }

    .day-tab {
      position: absolute;
      top: -11px;
      left: 20px;
      background: var(--accent);
      color: var(--accent-ink);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 6px;
    }

    .day-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .day-panel-date {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
    }

    .check-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
    }

    .check-toggle input { width: 16px; height: 16px; accent-color: var(--good); cursor: pointer; }

    .day-entries { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }

    .empty-hint { font-size: 12.5px; color: var(--text-faint); padding: 4px 0; }

    .add-here-btn {
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px dashed var(--accent);
      background: transparent;
      color: var(--accent-strong);
      cursor: pointer;
      font-family: inherit;
    }

    .add-here-btn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }

    /* Form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }

    .field label {
      font-size: 11px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .field input,
    .field select,
    .field textarea {
      background: var(--paper-2);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      color: var(--text);
      font-size: 13.5px;
      padding: 10px 12px;
      font-family: var(--font-body);
    }

    .field input,
    .field select { font-family: var(--font-mono); }

    .field textarea {
      resize: vertical;
      min-height: 84px;
      font-family: var(--font-body);
      line-height: 1.9;
      background-image: repeating-linear-gradient(
        var(--paper-2) 0,
        var(--paper-2) 1.85em,
        var(--hairline-soft) 1.85em,
        var(--hairline-soft) calc(1.85em + 1px)
      );
      background-attachment: local;
    }

    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-actions { display: flex; gap: 8px; margin-top: 16px; }

    .btn-primary {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      font-size: 13.5px;
      letter-spacing: 0.02em;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary:hover { background: var(--accent-strong); }

    .btn-cancel {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--hairline);
      background: transparent;
      color: var(--text-dim);
      font-size: 13.5px;
      cursor: pointer;
      font-family: inherit;
    }

    /* Log list (timeline) */
    .log-list { display: flex; flex-direction: column; gap: 16px; }

    .log-item {
      position: relative;
      padding-left: 18px;
      border-left: 2px solid var(--cat-color, var(--hairline));
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-item::before {
      content: "";
      position: absolute;
      left: -5px;
      top: 5px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--cat-color, var(--hairline));
    }

    .log-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .log-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .log-date {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .badge {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .log-minutes { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }

    .log-content { font-size: 13.5px; white-space: pre-wrap; word-break: break-word; color: var(--text); }

    .log-actions { display: flex; gap: 12px; }

    .icon-btn {
      font-size: 11.5px;
      padding: 0;
      border: none;
      background: none;
      color: var(--text-faint);
      cursor: pointer;
      font-family: inherit;
    }

    .icon-btn:hover { color: var(--accent-strong); text-decoration: underline; }
    .icon-btn.danger:hover { color: var(--warn); }

    .backup-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .backup-row .icon-btn {
      padding: 7px 12px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      color: var(--text-dim);
    }
    .backup-row .icon-btn:hover { border-color: var(--accent); text-decoration: none; }

    footer {
      margin-top: 24px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-faint);
      text-align: center;
      line-height: 1.8;
    }

    @media (min-width: 760px) {
      .top-grid { grid-template-columns: 300px 1fr; align-items: start; }
    }

    @media (max-width: 480px) {
      .page { padding: 24px 14px 48px; }
      .form-grid { grid-template-columns: 1fr; }
      .cal-day { font-size: 11px; }
      .streak-figure { font-size: 36px; }
      section { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="mark">EN</div>
      <div class="titles">
        <h1>영어 습관 트래커</h1>
        <p>매일 배운 것을 적고, 공부한 날에 표시하세요</p>
      </div>
      <nav class="top-nav">
        <a href="index.html">← 홈</a>
      </nav>
    </header>

    <div class="top-grid">
      <section>
        <div class="section-title">이번 달 현황</div>
        <div class="streak-panel">
          <svg class="flame-icon" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="var(--accent-strong)" />
                <stop offset="1" stop-color="var(--warn)" />
              </linearGradient>
            </defs>
            <path
              fill="url(#flameGrad)"
              d="M12.963 2.286a.75.75 0 00-1.071-.136 9.742 9.742 0 00-3.539 6.176 7.547 7.547 0 01-1.705-1.715.75.75 0 00-1.152-.082A9 9 0 1015.68 4.534a7.46 7.46 0 01-2.717-2.248zM15.75 14.25a3.75 3.75 0 11-7.313-1.172c.628.465 1.35.81 2.133 1a5.99 5.99 0 011.925-3.545 3.75 3.75 0 013.255 3.717z"
            />
          </svg>
          <div>
            <div class="streak-figure" id="statStreak">0<span class="unit">일째</span></div>
            <div class="streak-caption">연속 학습 중</div>
          </div>
        </div>
        <dl class="ledger">
          <div class="ledger-row">
            <dt>최장 기록</dt>
            <dd id="statLongest">0일</dd>
          </div>
          <div class="ledger-row">
            <dt>이번 달 학습일</dt>
            <dd id="statMonth">0/0일</dd>
          </div>
          <div class="ledger-row">
            <dt>이번 주 목표</dt>
            <dd>
              <span id="statWeek">0/0일</span>
              <span class="goal-edit">· 목표 <input type="number" id="goalInput" min="1" max="7" /></span>
            </dd>
          </div>
        </dl>
      </section>

      <section>
        <div class="cal-nav">
          <div class="cal-nav-btns">
            <button class="cal-btn" id="prevMonthBtn" aria-label="이전 달">‹</button>
            <div class="cal-label" id="calLabel"></div>
            <button class="cal-btn" id="nextMonthBtn" aria-label="다음 달">›</button>
          </div>
          <button class="cal-today-btn" id="gotoTodayBtn" type="button">오늘</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </section>
    </div>

    <section class="day-card">
      <span class="day-tab">오늘의 카드</span>
      <div class="day-panel-head">
        <div class="day-panel-date" id="dayPanelDate"></div>
        <label class="check-toggle">
          <input type="checkbox" id="dayDoneCheck" />
          공부 완료로 표시
        </label>
      </div>
      <div class="day-entries" id="dayEntries"></div>
      <button class="add-here-btn" id="addHereBtn" type="button">+ 이 날짜로 기록 추가</button>
    </section>

    <section>
      <div class="section-title" id="formTitle">오늘 배운 내용 기록하기</div>
      <form id="logForm">
        <div class="form-grid">
          <div class="field">
            <label for="fDate">날짜</label>
            <input type="date" id="fDate" required />
          </div>
          <div class="field">
            <label for="fCategory">분야</label>
            <select id="fCategory"></select>
          </div>
          <div class="field full">
            <label for="fContent">오늘 배운 내용</label>
            <textarea id="fContent" placeholder="예) 가정법 과거완료 문장 5개 만들어봄, 새 단어 10개 암기" required></textarea>
          </div>
          <div class="field">
            <label for="fMinutes">학습 시간(분, 선택)</label>
            <input type="number" id="fMinutes" min="0" placeholder="예) 30" />
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="submitBtn">기록 저장</button>
          <button type="button" class="btn-cancel" id="cancelEditBtn" hidden>취소</button>
        </div>
      </form>
    </section>

    <section>
      <div class="section-title">
        <span>학습 기록</span>
        <span class="count" id="logCount"></span>
      </div>
      <div class="log-list" id="logList"></div>
    </section>

    <section>
      <div class="section-title">백업</div>
      <div class="backup-row">
        <button class="icon-btn" id="exportBtn" type="button">내보내기 (JSON)</button>
        <button class="icon-btn" id="importBtn" type="button">가져오기</button>
        <input type="file" id="importFile" accept="application/json" hidden />
      </div>
    </section>

    <footer>기록은 이 브라우저에만 저장됩니다. 기기를 옮기려면 위 백업 기능을 이용하세요.</footer>
  </div>

  <script>
    const STORAGE_KEY = "englishHabitApp_v1";

    const CATEGORIES = [
      { value: "vocab", label: "단어", color: "var(--cat-vocab)" },
      { value: "grammar", label: "문법", color: "var(--cat-grammar)" },
      { value: "listening", label: "듣기", color: "var(--cat-listening)" },
      { value: "reading", label: "리딩", color: "var(--cat-reading)" },
      { value: "speaking", label: "스피킹", color: "var(--cat-speaking)" },
      { value: "writing", label: "라이팅", color: "var(--cat-writing)" },
      { value: "etc", label: "기타", color: "var(--cat-etc)" },
    ];

    function categoryInfo(value) {
      return CATEGORIES.find((c) => c.value === value) || CATEGORIES[CATEGORIES.length - 1];
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const d = raw ? JSON.parse(raw) : {};
        return {
          entries: Array.isArray(d.entries) ? d.entries : [],
          checks: d.checks && typeof d.checks === "object" ? d.checks : {},
          weeklyGoal: Number(d.weeklyGoal) > 0 ? Number(d.weeklyGoal) : 5,
        };
      } catch (e) {
        return { entries: [], checks: {}, weeklyGoal: 5 };
      }
    }

    let data = loadData();

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function pad(n) { return String(n).padStart(2, "0"); }
    function toKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
    function fromKey(k) {
      const [y, m, d] = k.split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    function startOfDay(d) { const c = new Date(d); c.setHours(0, 0, 0, 0); return c; }
    function todayKey() { return toKey(new Date()); }

    const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

    let viewDate = startOfDay(new Date());
    let selectedKey = todayKey();
    let editingId = null;

    /* ---------- Streaks & stats ---------- */

    function computeStreaks() {
      const trueKeys = Object.keys(data.checks).filter((k) => data.checks[k]).sort();
      let longest = 0, run = 0, prev = null;
      for (const key of trueKeys) {
        const d = fromKey(key);
        run = prev && d - prev === 86400000 ? run + 1 : 1;
        longest = Math.max(longest, run);
        prev = d;
      }

      let current = 0;
      let cursor = startOfDay(new Date());
      if (!data.checks[toKey(cursor)]) cursor.setDate(cursor.getDate() - 1);
      while (data.checks[toKey(cursor)]) {
        current += 1;
        cursor.setDate(cursor.getDate() - 1);
      }
      return { current, longest };
    }

    function weekRange(date) {
      const d = startOfDay(date);
      const day = d.getDay();
      const diffToMonday = day === 0 ? -6 : 1 - day;
      const monday = new Date(d);
      monday.setDate(d.getDate() + diffToMonday);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      return { monday, sunday };
    }

    function renderStats() {
      const { current, longest } = computeStreaks();
      document.getElementById("statStreak").innerHTML = `${current}<span class="unit">일째</span>`;
      document.getElementById("statLongest").innerHTML = `${longest}<span class="unit">일</span>`;

      const now = new Date();
      const monthPrefix = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const monthDone = Object.keys(data.checks).filter(
        (k) => k.startsWith(monthPrefix) && data.checks[k]
      ).length;
      document.getElementById("statMonth").innerHTML = `${monthDone}<span class="unit">/${daysInMonth}일</span>`;

      const { monday, sunday } = weekRange(now);
      let weekDone = 0;
      for (let d = new Date(monday); d <= sunday; d.setDate(d.getDate() + 1)) {
        if (data.checks[toKey(d)]) weekDone += 1;
      }
      document.getElementById("statWeek").innerHTML = `${weekDone}<span class="unit">/${data.weeklyGoal}일</span>`;
      document.getElementById("goalInput").value = data.weeklyGoal;
    }

    /* ---------- Calendar ---------- */

    function renderCalendar() {
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      document.getElementById("calLabel").textContent = `${year}년 ${month + 1}월`;

      const grid = document.getElementById("calGrid");
      grid.innerHTML = "";

      WEEKDAYS.forEach((label, i) => {
        const el = document.createElement("div");
        el.className = "cal-weekday" + (i === 0 ? " sun" : i === 6 ? " sat" : "");
        el.textContent = label;
        grid.appendChild(el);
      });

      const firstWeekday = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const tKey = todayKey();

      for (let i = 0; i < firstWeekday; i++) {
        const blank = document.createElement("div");
        blank.className = "cal-day blank";
        grid.appendChild(blank);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const key = `${year}-${pad(month + 1)}-${pad(day)}`;
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cal-day";
        if (key === tKey) cell.classList.add("today");
        if (data.checks[key]) cell.classList.add("done");
        if (key === selectedKey) cell.classList.add("selected");
        cell.textContent = String(day);

        const hasEntries = data.entries.some((e) => e.date === key);
        if (hasEntries && !data.checks[key]) {
          const dot = document.createElement("span");
          dot.className = "dot";
          cell.appendChild(dot);
        }

        cell.addEventListener("click", () => {
          selectedKey = key;
          renderCalendar();
          renderDayPanel();
        });
        grid.appendChild(cell);
      }
    }

    function formatDateLabel(key) {
      const d = fromKey(key);
      return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
    }

    /* ---------- Day panel ---------- */

    function renderDayPanel() {
      document.getElementById("dayPanelDate").textContent = formatDateLabel(selectedKey);
      const checkbox = document.getElementById("dayDoneCheck");
      checkbox.checked = !!data.checks[selectedKey];

      const list = document.getElementById("dayEntries");
      list.innerHTML = "";
      const dayEntries = data.entries.filter((e) => e.date === selectedKey);

      if (!dayEntries.length) {
        const hint = document.createElement("div");
        hint.className = "empty-hint";
        hint.textContent = "이 날짜에 기록된 학습 내용이 없어요.";
        list.appendChild(hint);
      } else {
        dayEntries.forEach((entry) => list.appendChild(buildLogItem(entry)));
      }
    }

    /* ---------- Log list ---------- */

    function buildLogItem(entry) {
      const cat = categoryInfo(entry.category);
      const item = document.createElement("div");
      item.className = "log-item";
      item.style.setProperty("--cat-color", cat.color);

      const head = document.createElement("div");
      head.className = "log-item-head";

      const meta = document.createElement("div");
      meta.className = "log-meta";

      const dateEl = document.createElement("span");
      dateEl.className = "log-date";
      dateEl.textContent = formatDateLabel(entry.date);
      meta.appendChild(dateEl);

      const badge = document.createElement("span");
      badge.className = "badge";
      badge.style.background = `color-mix(in srgb, ${cat.color} 24%, transparent)`;
      badge.style.color = cat.color;
      badge.textContent = cat.label;
      meta.appendChild(badge);

      if (entry.minutes) {
        const min = document.createElement("span");
        min.className = "log-minutes";
        min.textContent = `${entry.minutes}분`;
        meta.appendChild(min);
      }

      head.appendChild(meta);

      const actions = document.createElement("div");
      actions.className = "log-actions";

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "icon-btn";
      editBtn.textContent = "수정";
      editBtn.addEventListener("click", () => startEdit(entry.id));
      actions.appendChild(editBtn);

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "icon-btn danger";
      delBtn.textContent = "삭제";
      delBtn.addEventListener("click", () => deleteEntry(entry.id));
      actions.appendChild(delBtn);

      head.appendChild(actions);
      item.appendChild(head);

      const content = document.createElement("div");
      content.className = "log-content";
      content.textContent = entry.content;
      item.appendChild(content);

      return item;
    }

    function renderLogList() {
      const list = document.getElementById("logList");
      list.innerHTML = "";

      const sorted = [...data.entries].sort((a, b) => {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        return b.id.localeCompare(a.id);
      });

      document.getElementById("logCount").textContent = sorted.length ? `총 ${sorted.length}건` : "";

      if (!sorted.length) {
        const hint = document.createElement("div");
        hint.className = "empty-hint";
        hint.textContent = "아직 기록이 없어요. 오늘 배운 내용을 남겨보세요.";
        list.appendChild(hint);
        return;
      }

      sorted.forEach((entry) => list.appendChild(buildLogItem(entry)));
    }

    /* ---------- Form ---------- */

    const form = document.getElementById("logForm");
    const fDate = document.getElementById("fDate");
    const fCategory = document.getElementById("fCategory");
    const fContent = document.getElementById("fContent");
    const fMinutes = document.getElementById("fMinutes");
    const submitBtn = document.getElementById("submitBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const formTitle = document.getElementById("formTitle");

    CATEGORIES.forEach((c) => {
      const opt = document.createElement("option");
      opt.value = c.value;
      opt.textContent = c.label;
      fCategory.appendChild(opt);
    });

    function resetForm() {
      editingId = null;
      form.reset();
      fDate.value = selectedKey;
      fCategory.value = CATEGORIES[0].value;
      submitBtn.textContent = "기록 저장";
      formTitle.textContent = "오늘 배운 내용 기록하기";
      cancelEditBtn.hidden = true;
    }

    function startEdit(id) {
      const entry = data.entries.find((e) => e.id === id);
      if (!entry) return;
      editingId = id;
      fDate.value = entry.date;
      fCategory.value = entry.category;
      fContent.value = entry.content;
      fMinutes.value = entry.minutes || "";
      submitBtn.textContent = "수정 저장";
      formTitle.textContent = "기록 수정하기";
      cancelEditBtn.hidden = false;
      form.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function deleteEntry(id) {
      if (!confirm("이 기록을 삭제할까요?")) return;
      data.entries = data.entries.filter((e) => e.id !== id);
      saveData();
      renderAll();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const date = fDate.value || todayKey();
      const content = fContent.value.trim();
      if (!content) return;

      if (editingId) {
        const entry = data.entries.find((en) => en.id === editingId);
        if (entry) {
          entry.date = date;
          entry.category = fCategory.value;
          entry.content = content;
          entry.minutes = Number(fMinutes.value) || 0;
        }
      } else {
        data.entries.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          date,
          category: fCategory.value,
          content,
          minutes: Number(fMinutes.value) || 0,
        });
      }

      data.checks[date] = true;
      saveData();
      selectedKey = date;
      resetForm();
      renderAll();
    });

    cancelEditBtn.addEventListener("click", resetForm);

    document.getElementById("addHereBtn").addEventListener("click", () => {
      resetForm();
      fDate.value = selectedKey;
      fContent.focus();
    });

    document.getElementById("dayDoneCheck").addEventListener("change", (e) => {
      if (e.target.checked) data.checks[selectedKey] = true;
      else delete data.checks[selectedKey];
      saveData();
      renderCalendar();
      renderStats();
    });

    document.getElementById("goalInput").addEventListener("change", (e) => {
      const val = Math.min(7, Math.max(1, Number(e.target.value) || 5));
      data.weeklyGoal = val;
      saveData();
      renderStats();
    });

    /* ---------- Calendar nav ---------- */

    document.getElementById("prevMonthBtn").addEventListener("click", () => {
      viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
      renderCalendar();
    });

    document.getElementById("nextMonthBtn").addEventListener("click", () => {
      viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
      renderCalendar();
    });

    document.getElementById("gotoTodayBtn").addEventListener("click", () => {
      viewDate = startOfDay(new Date());
      selectedKey = todayKey();
      renderCalendar();
      renderDayPanel();
    });

    /* ---------- Backup ---------- */

    document.getElementById("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `english-habit-backup-${todayKey()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    const importFile = document.getElementById("importFile");
    document.getElementById("importBtn").addEventListener("click", () => importFile.click());

    importFile.addEventListener("change", () => {
      const file = importFile.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!confirm("가져온 데이터로 현재 기록을 덮어쓸까요?")) return;
          data = {
            entries: Array.isArray(parsed.entries) ? parsed.entries : [],
            checks: parsed.checks && typeof parsed.checks === "object" ? parsed.checks : {},
            weeklyGoal: Number(parsed.weeklyGoal) > 0 ? Number(parsed.weeklyGoal) : 5,
          };
          saveData();
          renderAll();
        } catch (e) {
          alert("올바른 백업 파일이 아니에요.");
        }
      };
      reader.readAsText(file);
      importFile.value = "";
    });

    /* ---------- Render all ---------- */

    function renderAll() {
      renderStats();
      renderCalendar();
      renderDayPanel();
      renderLogList();
    }

    fDate.value = selectedKey;
    fCategory.value = CATEGORIES[0].value;
    renderAll();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
